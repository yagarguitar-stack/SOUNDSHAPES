    var MAN_MIN=0.0004, MAN_MAX=0.008;     /* 遅れの土台 0.4〜8ミリ秒 */

    var f={rate:0.35, depth:0.6, fb:0.55, man:0.35, on:false};
    try{
      var sv=JSON.parse(localStorage.getItem('efbook.flanger')||'null');
      if(sv) for(var k in f) if(sv[k]!==undefined) f[k]=sv[k];
      f.rate=Math.max(RATE_MIN,Math.min(RATE_MAX,f.rate));
      ['depth','fb','man'].forEach(function(k){ f[k]=Math.max(0,Math.min(1,f[k])); });
    }catch(e){}
    function keepIt(){ try{ localStorage.setItem('efbook.flanger',JSON.stringify(f)); }catch(e){} }
    function manSec(){ return MAN_MIN+(MAN_MAX-MAN_MIN)*f.man; }

    var LFO=null,MOD,DL,FB,FBLP,WET,DRY;
    function rebuild(){
      if(!AC) return;
      DRY=AC.createGain(); DRY.gain.value=1;
      WET=AC.createGain(); WET.gain.value=0.7;
      DL=AC.createDelay(0.05);
      FB=AC.createGain();
      FBLP=AC.createBiquadFilter(); FBLP.type='lowpass'; FBLP.Q.value=0.5; FBLP.frequency.value=7000;
      LFO=AC.createOscillator(); LFO.type='sine';
      MOD=AC.createGain();
      LFO.connect(MOD); MOD.connect(DL.delayTime);
      FXIN.connect(DRY); DRY.connect(FXOUT);
      FXIN.connect(DL);
      DL.connect(FBLP); FBLP.connect(FB); FB.connect(DL);   /* 戻り */
      DL.connect(WET); WET.connect(FXOUT);
      try{ LFO.start(); }catch(e){}
      apply();
    }
    function apply(){
      if(!LFO) return;
      LFO.frequency.value=RATE_MIN+(RATE_MAX-RATE_MIN)*f.rate;
      DL.delayTime.value=manSec();
      MOD.gain.value=f.depth*Math.min(manSec()*0.9,0.0035);
      /* 入切で変わるのはうねりの量だけ。原音はいつも素通し */
      FB.gain.value=f.on?f.fb*0.85:0;
      DRY.gain.value=1;
      WET.gain.value=f.on?0.7:0;
    }
    function hush(t){
      if(!WET) return;
      try{
        FB.gain.cancelScheduledValues(t); FB.gain.setValueAtTime(0,t);
        WET.gain.cancelScheduledValues(t);
        WET.gain.setValueAtTime(Math.max(0.0001,WET.gain.value),t);
        WET.gain.exponentialRampToValueAtTime(0.0001,t+0.08);
      }catch(e){}
    }
    function detachAudio(){
      if(!AC) return;
      LFO=null;
    }

    var HTML=''+
    '<div class="case"><div class="pedal flg">'+
      '<div class="flg-head">'+
        '<div class="flg-name">FLANGER</div>'+
        '<div class="flg-sub">JET MODULATION</div>'+
      '</div>'+
      '<div class="flg-comb" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>'+
      '<div class="deck">'+

  /* ══════════════════════════════════════
     6台目：フェイザー
     フランジャーが「打ち消し合いの谷」を動かすのに対し、
     こちらは位相をずらす回路（オールパス）を数段重ね、

     ══════════════════════════════════════ */
  (function(){
    var STAGES=[{id:'s4',label:'4 STAGE',n:4},{id:'s8',label:'8 STAGE',n:8}];

    var F_MIN=250, F_MAX=1800;             /* 谷が動く範囲（Hz） */

    var p={rate:0.3, depth:0.7, fb:0.35, stage:'s4', on:false};
    try{
      var sv=JSON.parse(localStorage.getItem('efbook.phaser')||'null');
      if(sv) for(var k in p) if(sv[k]!==undefined) p[k]=sv[k];
      p.rate=Math.max(0,Math.min(1,p.rate));
      p.depth=Math.max(0,Math.min(1,p.depth));
      p.fb=Math.max(0,Math.min(1,p.fb));
    }catch(e){}
    function keepIt(){ try{ localStorage.setItem('efbook.phaser',JSON.stringify(p)); }catch(e){} }
    function stageOf(){ for(var i=0;i<STAGES.length;i++) if(STAGES[i].id===p.stage) return STAGES[i]; return STAGES[0]; }
    function stageIdx(){ for(var i=0;i<STAGES.length;i++) if(STAGES[i].id===p.stage) return i; return 0; }

    var LFO=null,MODS=[],APS=[],FB,WET,DRY,_n=0;
    function rebuild(){
      if(!AC) return;
      DRY=AC.createGain(); DRY.gain.value=1;
      WET=AC.createGain();
      FB=AC.createGain();
      LFO=AC.createOscillator(); LFO.type='sine';
      APS=[]; MODS=[];
      var n=stageOf().n, prev=null, first=null;
      for(var i=0;i<n;i++){
        var ap=AC.createBiquadFilter();
        ap.type='allpass'; ap.Q.value=0.7; ap.frequency.value=(F_MIN+F_MAX)/2;
        var mod=AC.createGain();
        LFO.connect(mod); mod.connect(ap.frequency);
        if(prev) prev.connect(ap); else first=ap;
        prev=ap;
        APS.push(ap); MODS.push(mod);
      }
      _n=n;
      FXIN.connect(DRY); DRY.connect(FXOUT);
      FXIN.connect(first);
      prev.connect(FB); FB.connect(first);      /* 戻り。谷が鋭くなる */
      prev.connect(WET); WET.connect(FXOUT);
      try{ LFO.start(); }catch(e){}
      apply();

    function apply(){
      if(!LFO) return;

         全体は少し小さくなる。素通りの時と釣り合うよう、原音側を半分にする。 */
      FB.gain.value=p.on?p.fb*0.7:0;
      DRY.gain.value=p.on?0.62:1;
      WET.gain.value=p.on?0.62:0;
    }
    function hush(t){
      if(!WET) return;

        FB.gain.cancelScheduledValues(t); FB.gain.setValueAtTime(0,t);
        WET.gain.cancelScheduledValues(t);
        WET.gain.setValueAtTime(Math.max(0.0001,WET.gain.value),t);
        WET.gain.exponentialRampToValueAtTime(0.0001,t+0.08);
      }catch(e){}
    }
    function detachAudio(){

      LFO=null;
    }

    var HTML=''+
    '<div class="case"><div class="pedal phs">'+

        '<div class="ctl"><div class="knob" id="phFb" tabindex="0" role="slider" aria-label="FEEDBACK"'+

          '<div class="ctl-name">FEEDBACK</div><div class="ctl-val" id="phFbV">35%</div></div>'+
        '<div class="ctl"><div class="knob" id="phStage" tabindex="0" role="slider" aria-label="STAGE"'+
          ' aria-valuemin="1" aria-valuemax="2"><div class="knob-ring"></div></div>'+
          '<div class="ctl-name">STAGE</div><div class="ctl-val" id="phStageV">4 STAGE</div></div>'+
      '</div>'+
      '<div class="stomps"><div class="stomp-cell">'+
        '<div class="indicator" id="phLed"></div>'+
        '<button class="stomp" id="phStomp" aria-label="フェイザーの入切"></button>'+
        '<div class="stomp-name" id="phName">踏むと入切</div>'+
      '</div></div>'+
      '<div class="feet"><i></i><i></i></div>'+
    '</div></div>';

    function render(stage){

      pctKnob(el('phRate'),el('phRateV'),function(){ return p.rate; },
        function(x){ p.rate=x; keepIt(); apply(); },1,
        function(){ return (Math.round((RATE_MIN+(RATE_MAX-RATE_MIN)*p.rate)*100)/100)+'Hz'; });
      pctKnob(el('phDepth'),el('phDepthV'),function(){ return p.depth; },
        function(x){ p.depth=x; keepIt(); apply(); },1);
      pctKnob(el('phFb'),el('phFbV'),function(){ return p.fb; },
        function(x){ p.fb=x; keepIt(); apply(); },1);
      addScale(el('phRate'),11,280,['0.05','6.0']);
      addScale(el('phDepth'),11,280,['0','100']);
      addScale(el('phFb'),11,280,['0','100']);
      selKnob(el('phStage'),el('phStageV'),STAGES,function(id){
        p.stage=id; keepIt();
        if(current&&current.stop) current.stop();
        rebuild();                       /* 段数が変わるので組み直す */
      },stageIdx);
      addScale(el('phStage'),STAGES.length,260,null);
      el('phStomp').addEventListener('click',function(){
        p.on=!p.on; keepIt(); drawOn(); apply();
        el('phName').textContent=p.on?'踏むと入切':'今は素通り';
      });
      drawOn();
      el('phName').textContent=p.on?'踏むと入切':'今は素通り';
    }

    definePedal({
      id:'phaser', name:'フェイザー', plate:'PHASE SHIFTER',
      blurb:'位相をずらし、谷を動かす',
      theme:{top:'#6d3050',mid:'#54233d',bot:'#301324',led:'#9dff70'},
      mini:'<svg viewBox="0 0 74 104"><g class="mm">'+
             '<text class="pl" x="37" y="12" text-anchor="middle" font-size="6.2">PHASER</text>'+
             '<g class="kn"><circle cx="37" cy="32" r="10"/><line x1="37" y1="25" x2="37" y2="29"/></g>'+
             '<g class="kn"><circle cx="16" cy="55" r="7"/><line x1="16" y1="50" x2="16" y2="53"/></g>'+
             '<g class="kn"><circle cx="37" cy="55" r="7"/><line x1="37" y1="50" x2="37" y2="53"/></g>'+
             '<g class="kn"><circle cx="58" cy="55" r="7"/><line x1="58" y1="50" x2="58" y2="53"/></g>'+
             '<circle class="ld" cx="37" cy="70" r="2.4"/>'+
             '<circle class="st" cx="37" cy="86" r="11"/>'+
           '</g></svg>',
      help:'位相をずらす回路を何段も重ね、原音と混ぜています。'+
           '混ざった時に打ち消し合う場所（谷）ができ、その谷が動くのでうねって聞こえます。<br>'+
           '<b>RATE</b>（レイト）は動く速さ、<b>DEPTH</b>（デプス）は動く幅、'+
           '<b>FEEDBACK</b>（フィードバック）は戻す量で、上げるほど谷が鋭くなります。'+
           '<b>STAGE</b>（ステージ）は段数です。段が増えると谷の数が増え、音色のクセが複雑になります。'+
           '強い弱いというより、変化の込み入り方が変わると捉えてください。<br>'+
           'フランジャーと似て聞こえますが、フランジャーは遅れによる櫛状の谷、'+
           'フェイザーは位相ずれによる数個の谷です。'+
           'ここでは仕組みを掴みやすくするため、段数と谷の関係を単純にして扱っています。',
      /* 板の上から入切を尋ね、また変えられるようにする */
      isOn:function(){ return !!p.on; },
      setOn:function(v){ p.on=!!v; keepIt(); apply(); },

      state:p, stages:STAGES, stageCount:function(){ return _n; }

  /* ══════════════════════════════════════
     7台目：トレモロ
     音量そのものを揺らす。仕組みが最も単純で、
     「揺れ」を耳で掴む最初の1台に向く。
     ══════════════════════════════════════ */
  (function(){
    var WAVES=[
      {id:'sine',  label:'SINE',   type:'sine'},      /* なめらかに寄せては返す */
      {id:'tri',   label:'TRIANGLE',type:'triangle'}, /* 一定の速さで上下する */
      {id:'square',label:'SQUARE', type:'square'}     /* 出る・切れるがはっきりする */
    ];
    var RATE_MIN=0.3, RATE_MAX=12.0;

    var m={rate:0.35, depth:0.6, level:0.6, wave:'sine', on:false};
    try{
      var sv=JSON.parse(localStorage.getItem('efbook.tremolo')||'null');
      if(sv) for(var k in m) if(sv[k]!==undefined) m[k]=sv[k];
      ['rate','depth','level'].forEach(function(k){ m[k]=Math.max(0,Math.min(1,m[k])); });
    }catch(e){}
    function keepIt(){ try{ localStorage.setItem('efbook.tremolo',JSON.stringify(m)); }catch(e){} }
    function waveOf(){ for(var i=0;i<WAVES.length;i++) if(WAVES[i].id===m.wave) return WAVES[i]; return WAVES[0]; }
    function waveIdx(){ for(var i=0;i<WAVES.length;i++) if(WAVES[i].id===m.wave) return i; return 0; }
    function rateHz(){ return RATE_MIN+(RATE_MAX-RATE_MIN)*m.rate; }

    var LFO=null,MOD,AMP,OUT;
    function rebuild(){
      if(!AC) return;
      AMP=AC.createGain();
      OUT=AC.createGain();
      LFO=AC.createOscillator();
      MOD=AC.createGain();
      LFO.connect(MOD); MOD.connect(AMP.gain);
      FXIN.connect(AMP); AMP.connect(OUT); OUT.connect(FXOUT);
      try{ LFO.start(); }catch(e){}
      apply();
    }
    function apply(){
      if(!LFO) return;
      LFO.type=waveOf().type;
      LFO.frequency.value=rateHz();
      /* 揺れの中心を下げ、その幅ぶんを上下させる。切れても音は消えきらない */
      /* ══ 入切で音量を揃える ══
         揺れの中心を1−幅/2に置くと、揺れの平均は素通りより小さくなる。
         その分を戻し、入切で平均の大きさが変わらないようにする。
         LEVELは最終音量として、動かした時だけ全体を変える。 */
      var d=m.on?m.depth*0.9:0;
      var comp=(d>0)?1/(1-d/2):1;
      AMP.gain.value=(1-d/2)*comp;
      MOD.gain.value=(d/2)*comp;
      OUT.gain.value=0.55+0.9*m.level;
    }
    function hush(t){
      if(!OUT) return;
      try{ OUT.gain.cancelScheduledValues(t); OUT.gain.setValueAtTime(OUT.gain.value,t); }catch(e){}
    }
    function detachAudio(){
      if(!AC) return;
      LFO=null;
    }

    var HTML=''+
    '<div class="case"><div class="pedal trm">'+
      '<div class="trm-head">'+
        '<div class="trm-name">TREMOLO</div>'+
        '<div class="trm-sub">AMPLITUDE</div>'+
      '</div>'+
      '<div class="trm-lamp" id="trmLamp" aria-hidden="true"><i></i></div>'+
      '<div class="deck">'+
        '<div class="ctl"><div class="knob" id="trRate" tabindex="0" role="slider" aria-label="RATE"'+
          ' aria-valuemin="0" aria-valuemax="100"><div class="knob-ring"></div></div>'+
          '<div class="ctl-name">RATE</div><div class="ctl-val" id="trRateV">4.4Hz</div></div>'+
        '<div class="ctl"><div class="knob" id="trDepth" tabindex="0" role="slider" aria-label="DEPTH"'+
          ' aria-valuemin="0" aria-valuemax="100"><div class="knob-ring"></div></div>'+
          '<div class="ctl-name">DEPTH</div><div class="ctl-val" id="trDepthV">60%</div></div>'+
        '<div class="ctl"><div class="knob" id="trLvl" tabindex="0" role="slider" aria-label="LEVEL"'+
          ' aria-valuemin="0" aria-valuemax="100"><div class="knob-ring"></div></div>'+
          '<div class="ctl-name">LEVEL</div><div class="ctl-val" id="trLvlV">60%</div></div>'+
      '</div>'+
      '<div class="trm-rule"></div>'+
      '<div class="deck two">'+
        '<div class="ctl"><div class="knob" id="trWave" tabindex="0" role="slider" aria-label="WAVE"'+
          ' aria-valuemin="1" aria-valuemax="3"><div class="knob-ring"></div></div>'+
          '<div class="ctl-name">WAVE</div><div class="ctl-val" id="trWaveV">SINE</div></div>'+
      '</div>'+
      '<div class="stomps"><div class="stomp-cell">'+
        '<div class="indicator" id="trLed"></div>'+
        '<button class="stomp" id="trStomp" aria-label="トレモロの入切"></button>'+
        '<div class="stomp-name" id="trName">踏むと入切</div>'+
      '</div></div>'+
      '<div class="feet"><i></i><i></i></div>'+
    '</div></div>';

    var anim=null;
    var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches;

    function render(stage){
      stage.innerHTML=HTML;
      var led=el('trLed'), lampDot=el('trmLamp').firstChild;
      function drawOn(){ led.className=m.on?'indicator on':'indicator'; }
      /* 明かりが揺れの形どおりに明滅する。音量の揺れを目で見せる */
      function pulse(){
        if(!document.body.contains(lampDot)){ if(anim) clearInterval(anim); anim=null; return; }
        var t=(Date.now()/1000)*rateHz(), ph=(t-Math.floor(t))*2*Math.PI, w=waveOf().id, v;
        if(w==='square') v=Math.sin(ph)>=0?1:-1;
        else if(w==='tri') v=2/Math.PI*Math.asin(Math.sin(ph));
        else v=Math.sin(ph);
        var d=m.on?m.depth*0.9:0;
        lampDot.style.opacity=String(Math.max(0.06,(1-d/2)+v*d/2));
      }
      if(anim) clearInterval(anim);
      if(!reduce) anim=setInterval(pulse,40);
      pulse();

      pctKnob(el('trRate'),el('trRateV'),function(){ return m.rate; },
        function(x){ m.rate=x; keepIt(); apply(); },1,
        function(){ return (Math.round(rateHz()*10)/10)+'Hz'; });
      pctKnob(el('trDepth'),el('trDepthV'),function(){ return m.depth; },
        function(x){ m.depth=x; keepIt(); apply(); },1);
      pctKnob(el('trLvl'),el('trLvlV'),function(){ return m.level; },
        function(x){ m.level=x; keepIt(); apply(); },1);
      addScale(el('trRate'),11,280,['0.3','12']);

  /* ══════════════════════════════════════
     8台目：ワウ
     山（強調される帯）を一つ作り、その位置を踏み板で動かす。
     かかと側で低く、つま先側で高い。人が「ワウ」と言う時の
     口の形の変化に近い。
     この1台だけ、操作の中心が踏み板そのものになる。
     ══════════════════════════════════════ */
  (function(){
    var F_MIN=400, F_MAX=2200;          /* 山の動く範囲（Hz） */
    var AUTO_HZ=1.1;                    /* オートで往復する速さ */

    var w={pos:0.35, auto:false, on:false};
    try{
      var sv=JSON.parse(localStorage.getItem('efbook.wah')||'null');

    function keepIt(){ try{ localStorage.setItem('efbook.wah',JSON.stringify(w)); }catch(e){} }
    function freqAt(pos){ return F_MIN*Math.pow(F_MAX/F_MIN,pos); }   /* 耳に合わせて対数で動かす */

    var PEAK=null,WET,DRY,OUT,LFO=null,LMOD=null;

       音だけ揺らすのではなく板も動かすので、目と耳が一致する。 */
    function apply(){
      if(!PEAK) return;
      PEAK.frequency.value=freqAt(w.pos);
      /* 山を強く出しつつ、原音も少し残す。全部を山にすると細くなる */
      WET.gain.value=w.on?1.5:0;
      DRY.gain.value=w.on?0.25:1;
      OUT.gain.value=w.on?0.9:1;

    function hush(t){

    /* ---- 見た目 ---- */
    var HTML=''+
    '<div class="wah-wrap">'+
      '<div class="wah-base">'+
        '<div class="wah-side"></div>'+
        /* 踏み板。上下にドラッグすると傾く */

          '<div class="wah-tread"></div>'+
          '<div class="wah-plate">WAH</div>'+

        '<div class="wah-toe">つま先</div>'+

      '</div>'+

        '<span class="wah-read-n" id="wahHz">700</span> Hz'+
        '<span class="wah-read-s" id="wahPos">踏み具合 35%</span>'+
      '</div>'+
      '<div class="wah-row">'+
        '<div class="stomp-cell">'+
          '<div class="indicator" id="wahLed"></div>'+
          '<button class="stomp small" id="wahStomp" aria-label="ワウの入切"></button>'+
          '<div class="stomp-name" id="wahName">踏むと入切</div>'+
        '</div>'+
        '<div class="stomp-cell">'+
          '<div class="indicator" id="wahAutoLed"></div>'+
          '<button class="stomp small" id="wahAuto" aria-label="オートの入切"></button>'+
          '<div class="stomp-name" id="wahAutoName">オート</div>'+
        '</div>'+
      '</div>'+
    '</div>';

    var anim=null;
    var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches;

    function render(stage){
      stage.innerHTML=HTML;
      var pedal=el('wahPedal'), led=el('wahLed'), aLed=el('wahAutoLed');

      function draw(){
        /* かかと側＝寝ている（0度）、つま先側＝踏み込んでいる（-26度） */
        pedal.style.transform='rotate('+(-26*w.pos)+'deg)';
        pedal.setAttribute('aria-valuenow',String(Math.round(w.pos*100)));
        el('wahHz').textContent=String(Math.round(freqAt(w.pos)));
        el('wahPos').textContent='踏み具合 '+Math.round(w.pos*100)+'%';
        led.className=w.on?'indicator on':'indicator';
        aLed.className=w.auto?'indicator on':'indicator';
        apply();
      }
      function setPos(x){ w.pos=Math.max(0,Math.min(1,x)); keepIt(); draw(); }

      /* 踏み板のドラッグ。上へ動かすと踏み込む */
      var drag=false,lastY=0;
      pedal.addEventListener('pointerdown',function(e){
        drag=true; lastY=e.clientY;
        if(pedal.setPointerCapture) pedal.setPointerCapture(e.pointerId);
        if(w.auto){ w.auto=false; keepIt(); }      /* 手で動かしたらオートは切れる */
        e.preventDefault();

      pedal.addEventListener('pointermove',function(e){
        if(!drag) return;

        lastY=e.clientY;
      });
      pedal.addEventListener('pointerup',function(){ drag=false; });
      pedal.addEventListener('pointercancel',function(){ drag=false; });
      pedal.addEventListener('keydown',function(e){
        if(e.key==='ArrowUp'||e.key==='ArrowRight'){ setPos(w.pos+0.05); e.preventDefault(); }
        if(e.key==='ArrowDown'||e.key==='ArrowLeft'){ setPos(w.pos-0.05); e.preventDefault(); }
      });

      el('wahStomp').addEventListener('click',function(){
        w.on=!w.on; keepIt(); draw();
        el('wahName').textContent=w.on?'踏むと入切':'今は素通り';
      });
      el('wahAuto').addEventListener('click',function(){

      function tick(){

        if(!w.auto) return;

      if(!reduce) anim=setInterval(tick,40);

      el('wahName').textContent=w.on?'踏むと入切':'今は素通り';
      el('wahAutoName').textContent=w.auto?'オート 入':'オート';
      draw();
    }

    definePedal({
      id:'wah', name:'ワウ', plate:'WAH',
      blurb:'踏み板で音の山を動かす',
      theme:{top:'#2f3338',mid:'#23272b',bot:'#111417',led:'#ff4d4d'},

             '<line x1="16" y1="52" x2="58" y2="52"/><line x1="16" y1="60" x2="58" y2="60"/></g>'+
             '</g>'+
             '<text class="pl" x="37" y="82" text-anchor="middle" font-size="6.6">WAH</text>'+
             '<circle class="ld" cx="37" cy="93" r="2.4"/>'+
           '</g></svg>',
      help:'強調される帯を踏み板で動かしています。'+
           'ここでは仕組みを分かりやすくするため、その帯を一つの山として表しています。'+
           '実際のワウは、周波数の特性全体が動くフィルターです。'+
           'かかと側では低い帯が、つま先側では高い帯が持ち上がります。'+
           '人が「ワウ」と言う時の口の形の変化に近い動きです。<br>'+
           '<b>踏み板を上下にドラッグ</b>してください。指を離した位置に留まります。'+
           '今の山の高さはヘルツで表示されます（400〜2200Hz）。<br>'+
           '左のフットスイッチで入切、右で<b>オート</b>になります。'+
           'オートの間は板が勝手に往復しますので、両手が空いた状態で効果を確かめられます。'+
           '板を手で動かすとオートは切れます。<br>'+
           '図の上でも動かせます。絵の<b>上半分</b>を上下にドラッグしてください。'+
           '下半分は台の並べ替えに使います。',
      /* 板の上から入切を尋ね、また変えられるようにする */
      isOn:function(){ return !!w.on; },
      setOn:function(v){ w.on=!!v; keepIt(); apply(); },
      render:render, rebuild:rebuild, apply:apply, hush:hush,
      detach:detachAudio,   /* 面の動きは絵が消えた時に自分で止まる */
      /* 板の上からも踏み板を動かせるようにする */
      treadle:{
        get:function(){ return w.pos; },
        set:function(x){ w.pos=Math.max(0,Math.min(1,x)); w.auto=false; keepIt(); apply(); },
        text:function(){ return Math.round(w.pos*100)+'% ・ '+Math.round(freqAt(w.pos))+'Hz'; }
      },
      state:w, freqAt:freqAt
    });
  })();

  /* ══════════════════════════════════════
     9台目：ピッチシフター
     音程を変えた声を作り、原音に重ねてハモリにする。
     ブラウザには音程だけを変える機能が無いので、
     音を細かく刻んで並べ直す（粒に切って重ねる）方式で作る。
     金属質な揺らぎが残るが、実機の安価な機種も同じ理屈である。
     ══════════════════════════════════════ */
  (function(){
    /* 使う音程の組み。半音の数で持つ。2つ入っているものは2声 */
    /* ══ 音程の並び ══
       度数（3rd、5th）と方向（UP／DOWN）で表す。実機で広く使われる書き方。
       半音の数も併せて出し、度数と半音の対応がその場で分かるようにする。
       短3度（3半音）と長3度（4半音）を別に置くのは、ハモリを教える上で要るため。 */
    var PRESETS=[
      {id:'oct_dn',  label:'1 OCT DOWN', ja:'1オクターブ下', semis:[-12]},
      {id:'5th_dn',  label:'5th DOWN',   ja:'完全5度下',     semis:[-7]},
      {id:'4th_dn',  label:'4th DOWN',   ja:'完全4度下',     semis:[-5]},
      {id:'2nd_up',  label:'2nd UP',     ja:'長2度上',       semis:[2]},
      {id:'m3rd_up', label:'m3rd UP',    ja:'短3度上',       semis:[3]},
      {id:'3rd_up',  label:'3rd UP',     ja:'長3度上',       semis:[4]},
      {id:'4th_up',  label:'4th UP',     ja:'完全4度上',     semis:[5]},
      {id:'5th_up',  label:'5th UP',     ja:'完全5度上',     semis:[7]},
      {id:'oct_up',  label:'1 OCT UP',   ja:'1オクターブ上', semis:[12]},
      {id:'triad',   label:'3rd + 5th',  ja:'長3度上と完全5度上', semis:[4,7]},
      {id:'m_triad', label:'m3rd + 5th', ja:'短3度上と完全5度上', semis:[3,7]},
      {id:'oct_2',   label:'1 OCT ±',    ja:'1オクターブ上と下',  semis:[-12,12]}
    ];
    var GRAIN=0.09;                 /* 粒の長さ（秒）。長いと滑らか、短いと反応が速い */

    var p={preset:'3rd_up', mix:0.5, level:0.5, fine:0.5, on:false};
    try{
      var sv=JSON.parse(localStorage.getItem('efbook.pitch')||'null');
      if(sv) for(var k in p) if(sv[k]!==undefined) p[k]=sv[k];
      ['mix','level','fine'].forEach(function(k){ p[k]=Math.max(0,Math.min(1,p[k])); });
    }catch(e){}
    function keepIt(){ try{ localStorage.setItem('efbook.pitch',JSON.stringify(p)); }catch(e){} }
    function presetOf(){ for(var i=0;i<PRESETS.length;i++) if(PRESETS[i].id===p.preset) return PRESETS[i]; return PRESETS[5]; }
    function presetIdx(){ for(var i=0;i<PRESETS.length;i++) if(PRESETS[i].id===p.preset) return i; return 5; }
    function cents(){ return Math.round((p.fine-0.5)*100); }        /* −50〜+50セント */
    function ratioOf(semi){ return Math.pow(2,(semi+cents()/100)/12); }

    /* ══ 粒に切って並べ直す ══
       遅れの長さを一定の速さで伸ばし続ければ音は下がり、縮め続ければ上がる。
       ただし端に着いた時に飛ぶので、2本を半周ずらして交互に鳴らし、
       山なりの音量で受け渡す。継ぎ目が聞こえないのはそのため。 */
    function sawWave(shifted){
      var n=24, real=new Float32Array(n), imag=new Float32Array(n);
      for(var i=1;i<n;i++){
        var v=(i%2?1:-1)*2/(i*Math.PI);          /* のこぎり波 */
        imag[i]=shifted?v*((i%2)?-1:1):v;        /* 半周ずらす */
      }
      return AC.createPeriodicWave(real,imag,{disableNormalization:true});
    }
    function cosWave(neg){
      var real=new Float32Array([0,neg?-1:1]), imag=new Float32Array(2);
      return AC.createPeriodicWave(real,imag,{disableNormalization:true});
    }
    function constSource(v){
      if(AC.createConstantSource){
        var cs=AC.createConstantSource(); cs.offset.value=v; return cs;
      }
      /* 古い環境向け。直流をこしらえて流す */
      var b=AC.createBuffer(1,128,AC.sampleRate), d=b.getChannelData(0);
      for(var i=0;i<128;i++) d[i]=1;
      var s=AC.createBufferSource(); s.buffer=b; s.loop=true;
      var g=AC.createGain(); g.gain.value=v; s.connect(g);
      s.__out=g; return s;
    }

    var IN=null,DRY,VOICE,OUT,parts=[];
    function buildVoice(semi,dest){
      var r=ratioOf(semi);
      var hz=Math.abs(1-r)/GRAIN;
      var sum=AC.createGain(); sum.gain.value=0.9; sum.connect(dest);
      for(var i=0;i<2;i++){
        var dl=AC.createDelay(GRAIN*2);
        dl.delayTime.value=GRAIN/2;
        var g=AC.createGain(); g.gain.value=0;
        IN.connect(dl); dl.connect(g); g.connect(sum);

        var saw=AC.createOscillator();
        saw.setPeriodicWave(sawWave(i===1));
        saw.frequency.value=hz;
        var amp=AC.createGain();
        amp.gain.value=(1-r>0?1:-1)*GRAIN/2;
        saw.connect(amp); amp.connect(dl.delayTime);

        var win=AC.createOscillator();
        win.setPeriodicWave(cosWave(i===1));
        win.frequency.value=hz;
        var wg=AC.createGain(); wg.gain.value=0.5;
        win.connect(wg); wg.connect(g.gain);
        var dc=constSource(0.5);
        (dc.__out||dc).connect(g.gain);

        try{ saw.start(); win.start(); dc.start(); }catch(e){}
        parts.push(saw,win,dc);
      }
      return sum;
    }
    function rebuild(){
      if(!AC) return;
      stopParts();
      IN=AC.createGain();

      VOICE=AC.createGain();

      IN.connect(DRY); DRY.connect(OUT);

      for(var i=0;i<semis.length;i++) buildVoice(semis[i],VOICE);

      parts.forEach(function(n){ try{ n.stop(); }catch(e){} });

    }

         原音はいつも素通し。MIXは重ねる声の量、LEVELは最終音量。
         入切そのものでは全体の大きさを変えない。 */
      DRY.gain.value=1;

      OUT.gain.value=0.55+0.9*p.level;
    }
    function hush(t){
      if(!VOICE) return;
      try{ VOICE.gain.cancelScheduledValues(t); VOICE.gain.setValueAtTime(VOICE.gain.value,t); }catch(e){}
    }
    function detachAudio(){
      if(!AC) return;
      stopParts();
      OUT=null;
    }

    var HTML=''+
    '<div class="case"><div class="pedal pit">'+
      '<div class="pit-head">'+
        '<div class="pit-name">PITCH SHIFTER</div>'+
        '<div class="pit-sub">HARMONY</div>'+
      '</div>'+
      '<div class="pit-win">'+
        '<div class="pit-row">'+
          '<span class="pit-deg" id="pitDeg">3rd UP</span>'+
          '<span class="pit-fine" id="pitFine">±0セント</span>'+
        '</div>'+
        '<div class="pit-row2">'+
          '<span class="pit-ja" id="pitJa">長3度上</span>'+
          '<span class="pit-semi" id="pitSemi">+4半音</span>'+
        '</div>'+
      '</div>'+
      '<div class="deck two">'+
        '<div class="ctl"><div class="knob big" id="pitPreset" tabindex="0" role="slider" aria-label="PITCH"'+
          ' aria-valuemin="1" aria-valuemax="7"><div class="knob-ring"></div></div>'+
          '<div class="ctl-name">PITCH</div><div class="ctl-val" id="pitPresetV">3rd UP</div></div>'+
        '<div class="ctl"><div class="knob" id="pitFineK" tabindex="0" role="slider" aria-label="FINE"'+
          ' aria-valuemin="0" aria-valuemax="100"><div class="knob-ring"></div></div>'+
          '<div class="ctl-name">FINE</div><div class="ctl-val" id="pitFineV">±0</div></div>'+
      '</div>'+
      '<div class="deck two">'+
        '<div class="ctl"><div class="knob" id="pitMix" tabindex="0" role="slider" aria-label="MIX"'+
          ' aria-valuemin="0" aria-valuemax="100"><div class="knob-ring"></div></div>'+
          '<div class="ctl-name">MIX</div><div class="ctl-val" id="pitMixV">50%</div></div>'+
        '<div class="ctl"><div class="knob" id="pitLvl" tabindex="0" role="slider" aria-label="LEVEL"'+
          ' aria-valuemin="0" aria-valuemax="100"><div class="knob-ring"></div></div>'+
          '<div class="ctl-name">LEVEL</div><div class="ctl-val" id="pitLvlV">50%</div></div>'+
      '</div>'+
      '<div class="stomps"><div class="stomp-cell">'+
        '<div class="indicator" id="pitLed"></div>'+
        '<button class="stomp" id="pitStomp" aria-label="ピッチシフターの入切"></button>'+
        '<div class="stomp-name" id="pitName">踏むと入切</div>'+
      '</div></div>'+
      '<div class="feet"><i></i><i></i></div>'+
    '</div></div>';

    function render(stage){
      stage.innerHTML=HTML;
      var led=el('pitLed');
      function drawWin(){
        var pr=presetOf();
        el('pitDeg').textContent=pr.label;
        el('pitJa').textContent=pr.ja;
        el('pitSemi').textContent=pr.semis.map(function(x){ return (x>0?'+':'')+x; }).join(' / ')+'半音';
        var c=cents();
        el('pitFine').textContent=(c>0?'+':(c<0?'':'±'))+c+'セント';
        el('pitFineV').textContent=(c>0?'+':(c<0?'':'±'))+c;
        led.className=p.on?'indicator on':'indicator';
      }
      pctKnob(el('pitMix'),el('pitMixV'),function(){ return p.mix; },
        function(x){ p.mix=x; keepIt(); apply(); },1);
      pctKnob(el('pitLvl'),el('pitLvlV'),function(){ return p.level; },
        function(x){ p.level=x; keepIt(); apply(); },1);
      pctKnob(el('pitFineK'),el('pitFineV'),function(){ return p.fine; },
        function(x){
          p.fine=x; keepIt(); drawWin();
          if(current&&current.stop) current.stop();
          rebuild();                       /* 音程が変わるので組み直す */
        },1,
        function(){ var c=cents(); return (c>0?'+':(c<0?'':'±'))+c; });
      addScale(el('pitMix'),11,280,['0','100']);
      addScale(el('pitLvl'),11,280,['0','100']);
      addScale(el('pitFineK'),11,280,['-50','+50']);

      selKnob(el('pitPreset'),el('pitPresetV'),PRESETS,function(id){
        p.preset=id; keepIt(); drawWin();
        if(current&&current.stop) current.stop();
        rebuild();
      },presetIdx);
      addScale(el('pitPreset'),PRESETS.length,260,null);

      el('pitStomp').addEventListener('click',function(){
        p.on=!p.on; keepIt(); drawWin(); apply();
        el('pitName').textContent=p.on?'踏むと入切':'今は素通り';
      });
      drawWin();
      el('pitName').textContent=p.on?'踏むと入切':'今は素通り';
    }

    definePedal({
      id:'pitch', name:'ピッチシフター', plate:'HARMONY',
      blurb:'音程を変えた声を重ねる',
      theme:{top:'#33508f',mid:'#283f71',bot:'#152241',led:'#eaf6ff'},
      mini:'<svg viewBox="0 0 74 104"><g class="mm">'+
             '<text class="pl" x="37" y="10" text-anchor="middle" font-size="6.6">PITCH</text>'+
             '<rect class="sc" x="7" y="13" width="60" height="15" rx="2"/>'+
             '<text class="sct" x="60" y="24" text-anchor="end" font-size="6.5">3rd</text>'+
             '<g class="kn"><circle cx="22" cy="43" r="9"/><line x1="22" y1="37" x2="22" y2="40"/></g>'+
             '<g class="kn"><circle cx="52" cy="43" r="7"/><line x1="52" y1="38" x2="52" y2="41"/></g>'+
             '<g class="kn"><circle cx="22" cy="62" r="7"/><line x1="22" y1="57" x2="22" y2="60"/></g>'+
             '<g class="kn"><circle cx="52" cy="62" r="7"/><line x1="52" y1="57" x2="52" y2="60"/></g>'+
             '<circle class="ld" cx="37" cy="75" r="2.4"/>'+
             '<circle class="st" cx="37" cy="89" r="11"/>'+
           '</g></svg>',
      help:'音程を変えた声を作り、原音に重ねています。原音は常に残りますので、'+
           '出てくるのはハモリです。<br>'+
           '<b>PITCH</b>（ピッチ）で音程を選びます。表し方は実機に倣って度数と向きで、'+
           'この教材では<b>3rd</b>を長3度、<b>m3rd</b>を短3度としています。'+
           '<b>3rd UP</b>なら長3度上、<b>5th DOWN</b>なら完全5度下です。'+
           '窓には度数・日本語・半音の数が並んで出ますので、'+
           '「長3度上とは4半音」という対応がその場で分かります。'+
           '<b>m3rd UP</b>（短3度上・3半音）と<b>3rd UP</b>（長3度上・4半音）を弾き比べると、'+
           'わずか半音の違いで、暗くも明るくも響くことが分かります。'+
           '<b>3rd + 5th</b>のように2声を選べば、和音になります。<br>'+
           '<b>FINE</b>（ファイン）はセント単位の微調整、<b>MIX</b>（ミックス）は重ねる声の音量、'+
           '<b>LEVEL</b>（レベル）は出口の音量です。<br>'+
           'ブラウザだけで音程を変えるため、ここでは音を細かく刻み、'+
           '遅れの長さを動かす簡易な方式にしています。'+
           'そのため金属質な揺らぎが残ります。実機の方式は様々で、これと同じとは限りません。'+
           '試し弾きは<b>ソロ</b>か<b>ジグザグ</b>（単音のフレーズ）でお試しください。',
      /* 板の上から入切を尋ね、また変えられるようにする */
      isOn:function(){ return !!p.on; },
      setOn:function(v){ p.on=!!v; keepIt(); apply(); },
      render:render, rebuild:rebuild, apply:apply, hush:hush,
      detach:detachAudio,
      state:p, presets:PRESETS, cents:cents, ratioOf:ratioOf
    });
  })();

  /* ══════════════════════════════════════
     10台目：コンプレッサー
     大きい音を押さえ込み、音量の凸凹をならす。
     効果が耳で掴みにくい種類なので、
     「今どれだけ押さえ込まれているか」を目で見せる。
     ══════════════════════════════════════ */
  (function(){
    var m={amount:0.5, attack:0.4, level:0.5, on:false};
    try{
      var sv=JSON.parse(localStorage.getItem('efbook.comp')||'null');
      if(sv) for(var k in m) if(sv[k]!==undefined) m[k]=sv[k];
      ['amount','attack','level'].forEach(function(k){ m[k]=Math.max(0,Math.min(1,m[k])); });
    }catch(e){}
    function keepIt(){ try{ localStorage.setItem('efbook.comp',JSON.stringify(m)); }catch(e){} }
    /* SUSTAIN を上げるほど、低い音量から強く押さえ込む */
    function threshDb(){ return -6-36*m.amount; }
    function ratio(){ return 2+14*m.amount; }
    function attackSec(){ return 0.001+0.049*m.attack; }

    var COMP=null,OUT,BY;
    function rebuild(){
      if(!AC) return;
      COMP=AC.createDynamicsCompressor?AC.createDynamicsCompressor():null;
      OUT=AC.createGain();
      BY=AC.createGain();
      FXIN.connect(BY); BY.connect(OUT);
      if(COMP){ FXIN.connect(COMP); COMP.connect(OUT); }
      OUT.connect(FXOUT);
      apply();
    }
    function apply(){
      if(!OUT) return;
      if(COMP){
        COMP.threshold.value=threshDb();
        COMP.ratio.value=ratio();
        COMP.knee.value=6;
        COMP.attack.value=attackSec();
        COMP.release.value=0.25;
      }
      /* 押さえ込んだぶん音量が下がるので、LEVEL で持ち上げて使う */
      /* 入切で変わるのは押さえ込みの有無だけ。LEVELは最終音量として常に効く */
      var on=m.on&&!!COMP;
      OUT.gain.value=0.7+1.1*m.level;
      BY.gain.value=on?0:1;
      if(COMP) COMP.__active=on;
    }
    function reduction(){
      /* 今どれだけ押さえ込まれているか（dB、0以下） */
      if(!COMP||!m.on) return 0;
      return (typeof COMP.reduction==='number')?COMP.reduction
            :(COMP.reduction&&typeof COMP.reduction.value==='number'?COMP.reduction.value:0);
    }
    function hush(t){
      if(!OUT) return;
      try{ OUT.gain.cancelScheduledValues(t); OUT.gain.setValueAtTime(OUT.gain.value,t); }catch(e){}
    }
    function detachAudio(){
      if(!AC) return;
      COMP=null;
    }

    var HTML=''+
    '<div class="case"><div class="pedal cmp">'+
      '<div class="cmp-head">'+
        '<div class="cmp-name">COMPRESSOR</div>'+
        '<div class="cmp-sub">DYNAMICS</div>'+
      '</div>'+
      /* 押さえ込みの量を見せる目盛。右へ振れるほど強く押さえている */
      '<div class="cmp-meter">'+
        '<div class="cmp-scale"><i></i><i></i><i></i><i></i><i></i><i></i></div>'+
        '<div class="cmp-bar"><span id="cmpBar"></span></div>'+
        '<div class="cmp-read"><span id="cmpDb">0.0</span> dB 押さえ込み</div>'+
      '</div>'+
      '<div class="deck">'+
        '<div class="ctl"><div class="knob" id="cmpAmt" tabindex="0" role="slider" aria-label="SUSTAIN"'+
          ' aria-valuemin="0" aria-valuemax="100"><div class="knob-ring"></div></div>'+
          '<div class="ctl-name">SUSTAIN</div><div class="ctl-val" id="cmpAmtV">50%</div></div>'+
        '<div class="ctl"><div class="knob" id="cmpAtk" tabindex="0" role="slider" aria-label="ATTACK"'+
          ' aria-valuemin="0" aria-valuemax="100"><div class="knob-ring"></div></div>'+
          '<div class="ctl-name">ATTACK</div><div class="ctl-val" id="cmpAtkV">21ms</div></div>'+
        '<div class="ctl"><div class="knob" id="cmpLvl" tabindex="0" role="slider" aria-label="LEVEL"'+
          ' aria-valuemin="0" aria-valuemax="100"><div class="knob-ring"></div></div>'+
          '<div class="ctl-name">LEVEL</div><div class="ctl-val" id="cmpLvlV">50%</div></div>'+
      '</div>'+
      '<div class="stomps"><div class="stomp-cell">'+
        '<div class="indicator" id="cmpLed"></div>'+
        '<button class="stomp" id="cmpStomp" aria-label="コンプレッサーの入切"></button>'+
        '<div class="stomp-name" id="cmpName">踏むと入切</div>'+
      '</div></div>'+
      '<div class="feet"><i></i><i></i></div>'+
    '</div></div>';

    var anim=null;
    function render(stage){
      stage.innerHTML=HTML;
      var led=el('cmpLed'), bar=el('cmpBar');
      function drawOn(){ led.className=m.on?'indicator on':'indicator'; }
      function tick(){
        if(!document.body.contains(bar)){ if(anim) clearInterval(anim); anim=null; return; }
        var db=reduction();                       /* 0〜-30dB あたり */
        var pct=Math.min(100,Math.max(0,-db/24*100));
        bar.style.width=pct.toFixed(1)+'%';
        el('cmpDb').textContent=(Math.round(db*10)/10).toFixed(1);
      }
      if(anim) clearInterval(anim);
      anim=setInterval(tick,60);
      tick();

      pctKnob(el('cmpAmt'),el('cmpAmtV'),function(){ return m.amount; },
        function(x){ m.amount=x; keepIt(); apply(); },1);
      pctKnob(el('cmpAtk'),el('cmpAtkV'),function(){ return m.attack; },
        function(x){ m.attack=x; keepIt(); apply(); },1,
        function(){ return Math.round(attackSec()*1000)+'ms'; });
      pctKnob(el('cmpLvl'),el('cmpLvlV'),function(){ return m.level; },
        function(x){ m.level=x; keepIt(); apply(); },1);
      addScale(el('cmpAmt'),11,280,['0','100']);
      addScale(el('cmpAtk'),11,280,['1','50']);
      addScale(el('cmpLvl'),11,280,['0','100']);

      el('cmpStomp').addEventListener('click',function(){
        m.on=!m.on; keepIt(); drawOn(); apply();
        el('cmpName').textContent=m.on?'踏むと入切':'今は素通り';
      });
      drawOn();
      el('cmpName').textContent=m.on?'踏むと入切':'今は素通り';
    }

    definePedal({
      id:'comp', name:'コンプレッサー', plate:'DYNAMICS',
      blurb:'音量の凸凹をならす',
      theme:{top:'#5c6470',mid:'#464d57',bot:'#262b32',led:'#7dffd0'},
      mini:'<svg viewBox="0 0 74 104"><g class="mm">'+
             '<text class="pl" x="37" y="11" text-anchor="middle" font-size="6.6">COMP</text>'+
             '<rect class="sc" x="8" y="15" width="58" height="9" rx="2"/>'+
             '<rect class="bar" x="10" y="17.5" width="22" height="4" rx="2"/>'+
             '<g class="kn"><circle cx="17" cy="40" r="8"/><line x1="17" y1="34" x2="17" y2="38"/></g>'+
             '<g class="kn"><circle cx="37" cy="40" r="8"/><line x1="37" y1="34" x2="37" y2="38"/></g>'+
             '<g class="kn"><circle cx="57" cy="40" r="8"/><line x1="57" y1="34" x2="57" y2="38"/></g>'+
             '<circle class="ld" cx="37" cy="58" r="2.4"/>'+
             '<circle class="st" cx="37" cy="79" r="11"/>'+
           '</g></svg>',
      help:'大きい音を押さえ込み、小さい音との差を縮めます。'+
           '弾く強さの差がならされ、粒がそろって聞こえます。'+
           '小さい部分が持ち上がって聞こえるため、結果として伸びが長くなったように感じます。<br>'+
           'この教材では<b>SUSTAIN</b>を、押さえ込みの強さをまとめて動かす簡易なつまみとして'+
           '使っています。実機では機種ごとに意味が異なります。<br>'+
           '<b>SUSTAIN</b>（サステイン）は押さえ込む強さ、'+
           '<b>ATTACK</b>（アタック）は押さえ込み始めるまでの速さです。'+
           '遅くすると弾いた瞬間の頭が通り抜け、粒立ちが残ります。'+
           '<b>LEVEL</b>（レベル）は出口の音量で、押さえ込んで下がったぶんを持ち上げます。<br>'+
           '効果が耳で掴みにくい種類ですので、面の目盛で'+
           '<b>今どれだけ押さえ込まれているか</b>を見せています。'+
           'フレーズを鳴らしながら目盛の動きを見ると、働きが分かります。',
      /* 板の上から入切を尋ね、また変えられるようにする */
      isOn:function(){ return !!m.on; },
      setOn:function(v){ m.on=!!v; keepIt(); apply(); },
      render:render, rebuild:rebuild, apply:apply, hush:hush,
      detach:detachAudio,   /* 面の動きは絵が消えた時に自分で止まる */
      state:m, threshDb:threshDb, ratio:ratio, attackSec:attackSec, reduction:reduction
    });
  })();

  /* ══════════════════════════════════════
     11台目：EQ
     帯域ごとに音量を上げ下げする。
     ほかの台にある TONE つまみの正体でもある。
     上げ下げの形をそのまま面に描いて見せる。
     ══════════════════════════════════════ */
  (function(){
    /* 5つの帯。それぞれ中心の高さと受け持つ幅を持つ */
    var BANDS=[
      {id:'low',   label:'100',  hz:100,  q:0.7,  type:'lowshelf'},
      {id:'lomid', label:'350',  hz:350,  q:0.9,  type:'peaking'},
      {id:'mid',   label:'800',  hz:800,  q:0.9,  type:'peaking'},
      {id:'himid', label:'2.5k', hz:2500, q:0.9,  type:'peaking'},
      {id:'high',  label:'6k',   hz:6000, q:0.7,  type:'highshelf'}
    ];
    var DB_MAX=12;

    var e={g:[0.5,0.5,0.5,0.5,0.5], level:0.5, on:false};
    try{
      var sv=JSON.parse(localStorage.getItem('efbook.eq')||'null');
      if(sv){
        if(Array.isArray(sv.g)&&sv.g.length===5) e.g=sv.g.map(function(x){ return Math.max(0,Math.min(1,x)); });
        if(sv.level!==undefined) e.level=Math.max(0,Math.min(1,sv.level));
        if(sv.on!==undefined) e.on=sv.on;
      }
    }catch(x){}
    function keepIt(){ try{ localStorage.setItem('efbook.eq',JSON.stringify(e)); }catch(x){} }
    function dbAt(i){ return (e.g[i]-0.5)*2*DB_MAX; }     /* −12〜+12dB */

    var FILT=[],OUT=null;
    function rebuild(){
      if(!AC) return;
      FILT=[];
      OUT=AC.createGain();
      var prev=null, first=null;
      for(var i=0;i<BANDS.length;i++){
        var f=AC.createBiquadFilter();
        f.type=BANDS[i].type; f.frequency.value=BANDS[i].hz; f.Q.value=BANDS[i].q;
        if(prev) prev.connect(f); else first=f;
        prev=f; FILT.push(f);
      }
      FXIN.connect(first);
      prev.connect(OUT); OUT.connect(FXOUT);
      apply();
    }
    function apply(){
      if(!OUT) return;
      /* 入切で変わるのは帯域の増減だけ。LEVELは最終音量として常に効く */
      for(var i=0;i<FILT.length;i++) FILT[i].gain.value=e.on?dbAt(i):0;
      OUT.gain.value=0.55+0.9*e.level;
    }
    function hush(t){
      if(!OUT) return;
      try{ OUT.gain.cancelScheduledValues(t); OUT.gain.setValueAtTime(OUT.gain.value,t); }catch(x){}
    }
    function detachAudio(){
      if(!AC) return;
      OUT=null;
    }

    /* 面の絵。5本の上げ下げをなめらかな線でつなぐ */
    function curvePath(){
      var pts=[],i;
      for(i=0;i<BANDS.length;i++) pts.push({x:16+i*57,y:34-dbAt(i)/DB_MAX*24});
      var d='M0,'+pts[0].y.toFixed(1)+' L'+pts[0].x.toFixed(1)+','+pts[0].y.toFixed(1);
      for(i=1;i<pts.length;i++){
        var a=pts[i-1], b=pts[i], mx=(a.x+b.x)/2;
        d+=' C'+mx.toFixed(1)+','+a.y.toFixed(1)+' '+mx.toFixed(1)+','+b.y.toFixed(1)+
           ' '+b.x.toFixed(1)+','+b.y.toFixed(1);
      }
      d+=' L260,'+pts[pts.length-1].y.toFixed(1);
      return d;
    }

    var HTML=''+
    '<div class="case"><div class="pedal eq">'+
      '<div class="eq-head">'+
        '<div class="eq-name">EQUALIZER</div>'+
        '<div class="eq-sub">5 BAND</div>'+
      '</div>'+
      '<div class="eq-win">'+
        '<svg viewBox="0 0 260 68" preserveAspectRatio="none">'+
          '<line x1="0" y1="34" x2="260" y2="34" stroke="currentColor" stroke-width="1" opacity=".22"/>'+
          '<path id="eqCurve" d="" fill="none" stroke="currentColor" stroke-width="2" opacity=".85"/>'+
        '</svg>'+
      '</div>'+
      '<div class="eq-faders" id="eqFaders"></div>'+
      '<div class="eq-rule"></div>'+
      '<div class="deck two">'+
        '<div class="ctl"><div class="knob" id="eqLvl" tabindex="0" role="slider" aria-label="LEVEL"'+
          ' aria-valuemin="0" aria-valuemax="100"><div class="knob-ring"></div></div>'+
          '<div class="ctl-name">LEVEL</div><div class="ctl-val" id="eqLvlV">50%</div></div>'+
      '</div>'+
      '<div class="stomps"><div class="stomp-cell">'+
        '<div class="indicator" id="eqLed"></div>'+
        '<button class="stomp" id="eqStomp" aria-label="EQの入切"></button>'+
        '<div class="stomp-name" id="eqName">踏むと入切</div>'+
      '</div></div>'+
      '<div class="feet"><i></i><i></i></div>'+
    '</div></div>';

    function render(stage){
      stage.innerHTML=HTML;
      var led=el('eqLed'), wrap=el('eqFaders');
      function drawCurve(){ el('eqCurve').setAttribute('d',curvePath()); }
      function drawOn(){ led.className=e.on?'indicator on':'indicator'; }

      /* 上げ下げは、つまみではなく縦のスライダーで持つ。形が一目で分かる */
      BANDS.forEach(function(b,i){
        var cell=document.createElement('div');
        cell.className='eq-cell';
        cell.innerHTML=
          '<div class="eq-slot" id="eqSlot'+i+'" tabindex="0" role="slider"'+
            ' aria-label="'+b.label+'Hz" aria-valuemin="-12" aria-valuemax="12">'+
            '<div class="eq-track"></div><div class="eq-cap" id="eqCap'+i+'"></div></div>'+
          '<div class="eq-hz">'+b.label+'</div>'+
          '<div class="eq-db" id="eqDb'+i+'">0</div>';
        wrap.appendChild(cell);
        var slot=el('eqSlot'+i), cap=el('eqCap'+i);
        function draw(){
          cap.style.bottom=(e.g[i]*100)+'%';
          var db=Math.round(dbAt(i)*10)/10;
          el('eqDb'+i).textContent=(db>0?'+':'')+db;
          slot.setAttribute('aria-valuenow',String(db));
          drawCurve();
        }
        function set(x){ e.g[i]=Math.max(0,Math.min(1,x)); keepIt(); draw(); apply(); }
        var drag=false,lastY=0;
        slot.addEventListener('pointerdown',function(ev){
          drag=true; lastY=ev.clientY;
          if(slot.setPointerCapture) slot.setPointerCapture(ev.pointerId);
          ev.preventDefault();
        });
        slot.addEventListener('pointermove',function(ev){
          if(!drag) return;
          set(e.g[i]+(lastY-ev.clientY)*0.012); lastY=ev.clientY;
        });
        slot.addEventListener('pointerup',function(){ drag=false; });
        slot.addEventListener('pointercancel',function(){ drag=false; });
        slot.addEventListener('keydown',function(ev){
          if(ev.key==='ArrowUp'||ev.key==='ArrowRight'){ set(e.g[i]+0.0417); ev.preventDefault(); }
          if(ev.key==='ArrowDown'||ev.key==='ArrowLeft'){ set(e.g[i]-0.0417); ev.preventDefault(); }
        });
        draw();
      });

      pctKnob(el('eqLvl'),el('eqLvlV'),function(){ return e.level; },
        function(x){ e.level=x; keepIt(); apply(); },1);
      addScale(el('eqLvl'),11,280,['0','100']);

      el('eqStomp').addEventListener('click',function(){
        e.on=!e.on; keepIt(); drawOn(); apply();
        el('eqName').textContent=e.on?'踏むと入切':'今は素通り';
      });
      drawOn(); drawCurve();
      el('eqName').textContent=e.on?'踏むと入切':'今は素通り';
    }

    definePedal({
      id:'eq', name:'EQ', plate:'5 BAND',
      blurb:'帯域ごとに上げ下げする',

      isOn:function(){ return !!e.on; },

  /* ══════════════════════════════════════
     12台目：ノイズゲート
     決めた音量より小さい音を通さない。
     歪みが持ち上げた「サー」という雑音や、
     弾いていない間の余韻を断ち切るために使う。
     効果が耳で掴みにくいので、開いている／閉じているを目で見せる。
     ══════════════════════════════════════ */
  (function(){
    var n={thresh:0.42, release:0.35, on:false};
    try{
      var sv=JSON.parse(localStorage.getItem('efbook.gate')||'null');
      if(sv) for(var k in n) if(sv[k]!==undefined) n[k]=sv[k];
      ['thresh','release'].forEach(function(k){ n[k]=Math.max(0,Math.min(1,n[k])); });
    }catch(e){}
    function keepIt(){ try{ localStorage.setItem('efbook.gate',JSON.stringify(n)); }catch(e){} }
    /* しきい値は -66dB〜-18dB。耳に合わせて dB で動かす */
    function threshDb(){ return -66+48*n.thresh; }
    function threshLin(){ return Math.pow(10,threshDb()/20); }
    function relSec(){ return 0.04+0.66*n.release; }

    /* 雑音の出どころ。実機の練習台として、板の上で雑音を作れるようにする */
    var noiseOn=false;                       /* これだけは覚えさせない（開くたび切） */

    var G=null,ANA=null,BUF=null,NSRC=null,NGAIN=null,loop=null;
    var opened=false, lvl=0;
    function rebuild(){
      if(!AC) return;
      G=AC.createGain(); G.gain.value=1;
      ANA=AC.createAnalyser(); ANA.fftSize=1024; ANA.smoothingTimeConstant=0;
      BUF=new Float32Array(ANA.fftSize);
      /* 雑音は台の入口で混ぜる。ゲートより前にあるものとして扱う */
      NGAIN=AC.createGain(); NGAIN.gain.value=0;
      try{
        var len=Math.floor(AC.sampleRate*2), b=AC.createBuffer(1,len,AC.sampleRate), a=b.getChannelData(0);
        for(var i=0;i<len;i++) a[i]=(Math.random()*2-1);
        NSRC=AC.createBufferSource(); NSRC.buffer=b; NSRC.loop=true;
        var hp=AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=900;
        NSRC.connect(hp); hp.connect(NGAIN);
        NSRC.start();
      }catch(e){ NSRC=null; }
      FXIN.connect(G); NGAIN.connect(G);
      FXIN.connect(ANA); NGAIN.connect(ANA);
      G.connect(FXOUT);
      opened=false;
      if(loop) clearInterval(loop);
      loop=setInterval(watch,25);
      apply();
    }
    /* 入口の音量を見張り、しきい値をまたいだところで開け閉めする。
       開ける時は速く、閉じる時はゆっくり。急に切ると音が途切れて聞こえる */
    function watch(){
      if(!G||!ANA||!AC) return;
      var s=0,i;
      if(ANA.getFloatTimeDomainData){
        ANA.getFloatTimeDomainData(BUF);
        for(i=0;i<BUF.length;i++) s+=BUF[i]*BUF[i];
        lvl=Math.sqrt(s/BUF.length);
      }else{
        var b8=new Uint8Array(ANA.fftSize);
        ANA.getByteTimeDomainData(b8);
        for(i=0;i<b8.length;i++){ var v=(b8[i]-128)/128; s+=v*v; }
        lvl=Math.sqrt(s/b8.length);
      }
      var target=1;
      if(n.on){
        var openTh=threshLin(), closeTh=openTh*0.55;   /* 開閉で差をつけ、ばたつきを防ぐ */
        if(!opened && lvl>openTh) opened=true;
        else if(opened && lvl<closeTh) opened=false;
        target=opened?1:0;
      }else{
        opened=true;
      }
      var tc=(target>0.5)?0.004:(relSec()/3);
      try{ G.gain.setTargetAtTime(target,AC.currentTime,tc); }
      catch(e){ G.gain.value=target; }
    }
    function apply(){
      if(NGAIN&&AC){
        try{ NGAIN.gain.setTargetAtTime(noiseOn?0.02:0,AC.currentTime,0.02); }
        catch(e){ NGAIN.gain.value=noiseOn?0.02:0; }
      }
    }
    function hush(t){
      if(!G) return;
      try{ G.gain.cancelScheduledValues(t); G.gain.setValueAtTime(G.gain.value,t); }catch(e){}
    }
    function detachAudio(){
      if(loop){ clearInterval(loop); loop=null; }
      if(NSRC){ try{ NSRC.stop(); }catch(e){} try{ NSRC.disconnect(); }catch(e){} NSRC=null; }
      G=null; ANA=null; NGAIN=null;
    }

    var HTML=''+
    '<div class="case"><div class="pedal cmp">'+
      '<div class="cmp-head">'+
        '<div class="cmp-name">NOISE GATE</div>'+
        '<div class="cmp-sub">THRESHOLD</div>'+
      '</div>'+
      /* 入口の音量と、しきい値の位置を並べて見せる */
      '<div class="cmp-meter">'+
        '<div class="cmp-scale"><i></i><i></i><i></i><i></i><i></i><i></i></div>'+
        '<div class="cmp-bar"><span id="gtBar"></span></div>'+
        '<div class="cmp-read"><span id="gtDb">-60</span> dB 入口の音量</div>'+
        '<div class="gt-state"><span class="gt-lamp" id="gtLamp"></span><span id="gtTxt">閉じている</span></div>'+
      '</div>'+
      '<div class="deck">'+
        '<div class="ctl"><div class="knob" id="gtTh" tabindex="0" role="slider" aria-label="THRESHOLD"'+
          ' aria-valuemin="0" aria-valuemax="100"><div class="knob-ring"></div></div>'+
          '<div class="ctl-name">THRESHOLD</div><div class="ctl-val" id="gtThV">-46dB</div></div>'+
        '<div class="ctl"><div class="knob" id="gtRel" tabindex="0" role="slider" aria-label="RELEASE"'+
          ' aria-valuemin="0" aria-valuemax="100"><div class="knob-ring"></div></div>'+
          '<div class="ctl-name">RELEASE</div><div class="ctl-val" id="gtRelV">271ms</div></div>'+
      '</div>'+
      '<div class="stomps gt-row">'+
        '<div class="stomp-cell">'+
          '<div class="indicator" id="gtLed"></div>'+
          '<button class="stomp small" id="gtStomp" aria-label="ノイズゲートの入切"></button>'+
          '<div class="stomp-name" id="gtName">踏むと入切</div>'+
        '</div>'+
        '<div class="stomp-cell">'+
          '<div class="indicator" id="gtNzLed"></div>'+
          '<button class="stomp small" id="gtNz" aria-label="雑音を出す"></button>'+
          '<div class="stomp-name" id="gtNzName">雑音を出す</div>'+
        '</div>'+
      '</div>'+
      '<div class="feet"><i></i><i></i></div>'+
    '</div></div>';

    var anim=null;
    function render(stage){
      stage.innerHTML=HTML;
      var led=el('gtLed'), nzLed=el('gtNzLed'), bar=el('gtBar'), lamp=el('gtLamp');
      function drawOn(){
        led.className=n.on?'indicator on':'indicator';
        nzLed.className=noiseOn?'indicator on':'indicator';
        el('gtName').textContent=n.on?'踏むと入切':'今は素通り';
        el('gtNzName').textContent=noiseOn?'雑音 出ている':'雑音を出す';
      }
      function tick(){
        if(!document.body.contains(bar)){ if(anim) clearInterval(anim); anim=null; return; }
        var db=(lvl>0)?20*Math.log10(lvl):-90;
        if(db<-72) db=-72;
        bar.style.width=Math.max(0,Math.min(100,(db+72)/72*100)).toFixed(1)+'%';
        el('gtDb').textContent=String(Math.round(db));
        var op=n.on?opened:true;
        lamp.className=op?'gt-lamp open':'gt-lamp';
        el('gtTxt').textContent=n.on?(op?'開いている':'閉じている'):'素通り';
      }
      if(anim) clearInterval(anim);
      anim=setInterval(tick,60);
      tick();

      pctKnob(el('gtTh'),el('gtThV'),function(){ return n.thresh; },
        function(x){ n.thresh=x; keepIt(); },1,
        function(){ return Math.round(threshDb())+'dB'; });
      pctKnob(el('gtRel'),el('gtRelV'),function(){ return n.release; },
        function(x){ n.release=x; keepIt(); },1,
        function(){ return Math.round(relSec()*1000)+'ms'; });
      addScale(el('gtTh'),11,280,['-66','-18']);
      addScale(el('gtRel'),11,280,['40','700']);

      el('gtStomp').addEventListener('click',function(){
        n.on=!n.on; keepIt(); drawOn();
      });
      el('gtNz').addEventListener('click',function(){
        noiseOn=!noiseOn; apply(); drawOn();
      });
      drawOn();
    }

    definePedal({
      id:'gate', name:'ノイズゲート', plate:'NOISE GATE',
      blurb:'小さい音を通さない',
      theme:{top:'#3c4a3f',mid:'#2e3a31',bot:'#18201a',led:'#9dffbe'},
      mini:'<svg viewBox="0 0 74 104"><g class="mm">'+
             '<text class="pl" x="37" y="11" text-anchor="middle" font-size="6.2">GATE</text>'+
             '<rect class="sc" x="8" y="15" width="58" height="9" rx="2"/>'+
             '<rect class="bar" x="10" y="17.5" width="14" height="4" rx="2"/>'+
             '<g class="kn"><circle cx="24" cy="42" r="9"/><line x1="24" y1="35" x2="24" y2="40"/></g>'+
             '<g class="kn"><circle cx="50" cy="42" r="9"/><line x1="50" y1="35" x2="50" y2="40"/></g>'+
             '<circle class="ld" cx="37" cy="60" r="2.4"/>'+
             '<circle class="st" cx="37" cy="80" r="11"/>'+
           '</g></svg>',
      help:[
        '<span class="lead">決めた音量より小さい音を、通さない台です。</span>'+
        '入口の音量を見張り、しきい値を上回ると門が開いて音が通り、'+
        '下回ると門が閉じて音が止まります。'+
        '音そのものは加工しません。通すか、通さないかだけを決めます。'+
        '<span class="hn">何のために使うか</span>'+
        '歪みは音を大きく持ち上げますが、その時に「サー」という雑音も一緒に持ち上げます。'+
        '弾いている間は音に隠れて気になりませんが、手を止めた途端に残ります。'+
        'これを断ち切るのがゲートの主な役目です。<br>'+
        'もう一つ、余韻をわざと断ち切る使い方があります。'+
        '刻んだフレーズの合間をすっぱり切ると、歯切れが良くなります。'+
        'メタルの刻みで使われる、音の切れ目がはっきりした感じはこの掛け方です。',
        '<span class="hn">確かめ方</span>'+
        '右のスイッチで<b>雑音を出す</b>と、弾いていない間も「サー」という音が出ます。'+
        'この状態で左のスイッチを踏むと、雑音が消えます。'+
        '弾けば門が開いて音が通り、音が消えればまた閉じます。'+
        'これがゲートの働きです。<br>'+
        '面の目盛は入口の音量、下のランプは今開いているかどうかを示します。'+
        '<span class="hn">つまみ</span>'+
        '<b>THRESHOLD</b>は門を開ける境目の音量です。'+
        '上げるほど大きな音でないと通らなくなり、'+
        '上げすぎると弾いた音の終わりまで切れてしまいます。'+
        '雑音が消える一番低いところに置くのが基本です。<br>'+
        '<b>RELEASE</b>は閉じる速さです。'+
        '速くすると切れ味が良くなりますが、音が不自然に途切れます。'+
        '遅くすると自然ですが、雑音が少し残ります。',
        '<span class="hn">置く場所</span>'+
        '雑音を出す台の<b>直後</b>に置きます。'+
        '歪みが雑音の出どころですから、歪みより前に置いても意味がありません。'+
        'そこで切っても、その後で歪みが雑音を足してしまいます。'+
        'この板では歪みの次に置いています。'+
        '<span class="hn">注意する点</span>'+
        '空間系より前に置くのが普通です。'+
        'ディレイやリバーブの後ろに置くと、返り音や残響そのものを切ってしまい、'+
        '尻尾が不自然に途切れます。<br>'+
        '弱く弾いた音が通らないこともあります。'+
        '設定は、雑音が消える最低限のところに留めてください。'+
        '強く掛けるほど、弾き手の弱い表現が失われます。'
      ],
      isOn:function(){ return !!n.on; },
      setOn:function(v){ n.on=!!v; keepIt(); },
      render:render, rebuild:rebuild, apply:apply, hush:hush,
      detach:detachAudio,
      state:n, threshDb:threshDb, relSec:relSec
    });
  })();

  /* ══════════════════════════════════════
     13台目：ボリュームペダル
     踏み板で音量そのものを上げ下げする。
     筐体はワウと同じ形。中身は山を動かすのではなく、
     出口の音量を動かすだけ。
     ══════════════════════════════════════ */
  (function(){
    var AUTO_HZ=0.32;                   /* オートで上げ下げする速さ */
    var v={pos:0.8, auto:false, on:false};
    try{
      var sv=JSON.parse(localStorage.getItem('efbook.vol')||'null');
      if(sv) for(var k in v) if(sv[k]!==undefined) v[k]=sv[k];
      v.pos=Math.max(0,Math.min(1,v.pos));
    }catch(e){}
    function keepIt(){ try{ localStorage.setItem('efbook.vol',JSON.stringify(v)); }catch(e){} }
    /* 耳は音量の変化を対数で感じる。踏み板の動きと聞こえ方を合わせる */
    function gainAt(pos){ return pos<=0.001?0:Math.pow(pos,2.2); }
    function dbAt(pos){
      var g=gainAt(pos);
      return g<=0.0001?-80:20*Math.log10(g);
    }

    var G=null;
    function rebuild(){
      if(!AC) return;
      G=AC.createGain();
      FXIN.connect(G); G.connect(FXOUT);
      apply();
    }
    function apply(){
      if(!G||!AC) return;
      var g=v.on?gainAt(v.pos):1;
      try{ G.gain.setTargetAtTime(g,AC.currentTime,0.012); }
      catch(e){ G.gain.value=g; }
    }
    function hush(t){
      if(!G) return;
      try{ G.gain.cancelScheduledValues(t); G.gain.setValueAtTime(G.gain.value,t); }catch(e){}
    }
    function detachAudio(){ G=null; }

    /* ---- 見た目。ワウと同じ踏み板を使う ---- */
    var HTML=''+
    '<div class="wah-wrap">'+
      '<div class="wah-base">'+
        '<div class="wah-side"></div>'+
        '<div class="wah-pedal" id="volPedal" tabindex="0" role="slider"'+
          ' aria-label="踏み板" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80">'+
          '<div class="wah-tread"></div>'+
          '<div class="wah-plate">VOLUME</div>'+
        '</div>'+
        '<div class="wah-toe">つま先</div>'+
        '<div class="wah-heel">かかと</div>'+
      '</div>'+
      '<div class="wah-read">'+
        '<span class="wah-read-n" id="volDb">0.0</span> dB'+
        '<span class="wah-read-s" id="volPos">踏み具合 80%</span>'+
      '</div>'+
      '<div class="wah-row">'+
        '<div class="stomp-cell">'+
          '<div class="indicator" id="volLed"></div>'+
          '<button class="stomp small" id="volStomp" aria-label="ボリュームペダルの入切"></button>'+
          '<div class="stomp-name" id="volName">踏むと入切</div>'+
        '</div>'+
        '<div class="stomp-cell">'+
          '<div class="indicator" id="volAutoLed"></div>'+
          '<button class="stomp small" id="volAuto" aria-label="オートの入切"></button>'+
          '<div class="stomp-name" id="volAutoName">オート</div>'+
        '</div>'+
      '</div>'+
    '</div>';

    var anim=null;
    var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches;

    function render(stage){
      stage.innerHTML=HTML;
      var pedal=el('volPedal'), led=el('volLed'), aLed=el('volAutoLed');

      function draw(){
        /* かかと側＝寝ている＝音が小さい、つま先側＝踏み込む＝音が大きい */
        pedal.style.transform='rotate('+(-26*v.pos)+'deg)';
        pedal.setAttribute('aria-valuenow',String(Math.round(v.pos*100)));
        var db=dbAt(v.pos);
        el('volDb').textContent=(db<=-79)?'−∞':(Math.round(db*10)/10).toFixed(1);
        el('volPos').textContent='踏み具合 '+Math.round(v.pos*100)+'%';
        led.className=v.on?'indicator on':'indicator';
        aLed.className=v.auto?'indicator on':'indicator';
        apply();
      }
      function setPos(x){ v.pos=Math.max(0,Math.min(1,x)); keepIt(); draw(); }

      var drag=false,lastY=0;
      pedal.addEventListener('pointerdown',function(e){
        drag=true; lastY=e.clientY;
        if(pedal.setPointerCapture) pedal.setPointerCapture(e.pointerId);
        if(v.auto){ v.auto=false; keepIt(); }
        e.preventDefault();
      });
      pedal.addEventListener('pointermove',function(e){
        if(!drag) return;
        setPos(v.pos+(lastY-e.clientY)*0.012);
        lastY=e.clientY;
      });
      pedal.addEventListener('pointerup',function(){ drag=false; });
      pedal.addEventListener('pointercancel',function(){ drag=false; });
      pedal.addEventListener('keydown',function(e){
        if(e.key==='ArrowUp'||e.key==='ArrowRight'){ setPos(v.pos+0.05); e.preventDefault(); }
        if(e.key==='ArrowDown'||e.key==='ArrowLeft'){ setPos(v.pos-0.05); e.preventDefault(); }
      });

      el('volStomp').addEventListener('click',function(){
        v.on=!v.on; keepIt(); draw();
        el('volName').textContent=v.on?'踏むと入切':'今は素通り';
      });
      el('volAuto').addEventListener('click',function(){
        v.auto=!v.auto; keepIt(); draw();
        el('volAutoName').textContent=v.auto?'オート 入':'オート';
      });

      /* オートの間は板そのものを上下させる。両手が空いた状態で確かめられる */
      function tick(){
        if(!document.body.contains(pedal)){ if(anim) clearInterval(anim); anim=null; return; }
        if(!v.auto) return;
        var t=(Date.now()/1000)*AUTO_HZ;
        var ph=(t-Math.floor(t))*2*Math.PI;
        v.pos=0.5-0.5*Math.cos(ph);
        draw();
      }
      if(anim) clearInterval(anim);
      if(!reduce) anim=setInterval(tick,40);

      el('volName').textContent=v.on?'踏むと入切':'今は素通り';
      el('volAutoName').textContent=v.auto?'オート 入':'オート';
      draw();
    }

    definePedal({
      id:'vol', name:'ボリュームペダル', plate:'VOLUME',
      blurb:'踏み板で音量を上げ下げする',
      theme:{top:'#4a4136',mid:'#3a332a',bot:'#1f1b15',led:'#ffd166'},
      mini:'<svg viewBox="0 0 74 104"><g class="mm">'+
             '<g class="trd" transform="rotate(-6 37 38)">'+
             '<rect class="tread" x="10" y="10" width="54" height="56" rx="5"/>'+
             '<g class="trl">'+

      help:[

      ],
      isOn:function(){ return !!v.on; },
      setOn:function(x){ v.on=!!x; keepIt(); apply(); },
      render:render, rebuild:rebuild, apply:apply, hush:hush,
      detach:detachAudio,
      /* 板の上からも踏み板を動かせるようにする */
      treadle:{
        get:function(){ return v.pos; },
        set:function(x){ v.pos=Math.max(0,Math.min(1,x)); v.auto=false; keepIt(); apply(); },
        text:function(){
          var db=dbAt(v.pos);
          return Math.round(v.pos*100)+'% ・ '+((db<=-79)?'−∞':(Math.round(db*10)/10).toFixed(1))+'dB';

      },
      state:v, gainAt:gainAt, dbAt:dbAt
    });
  })();

  /* ══════ 道の並び ══════
     台とアンプを一列に並べる。この列がそのまま音の道になる。
     アンプより左（先）にある台はアンプへ入る前を通り、
     右（後）にある台はアンプの後ろ、つまりFXループの中を通る。
     台は横へドラッグして入れ替えられる。アンプ自身も動かせる。
     アンプを右端まで送れば、全台がアンプの前を通る一本道になる。 */
  var SEND='amp-send', RET='amp-ret';
  function isAmp(id){ return id===SEND||id===RET; }
  var DEFAULT_LINE=['wah','comp','drive',SEND,'gate','vol','eq',
                    'chorus','flanger','phaser','tremolo','pitch','delay','reverb',RET];
  var LINE=DEFAULT_LINE.slice();
  try{
    var svl=JSON.parse(localStorage.getItem('efbook.line')||'null');
    if(svl&&svl.length) LINE=svl;
  }catch(e){}
  function keepLine(){ try{ localStorage.setItem('efbook.line',JSON.stringify(LINE)); }catch(e){} }
  function pedalOf(id){
    for(var i=0;i<PEDALS.length;i++) if(PEDALS[i].id===id) return PEDALS[i];
    return null;
  }
  /* 覚えていた並びが古くても壊れないように、毎回作り直す。
     知らない名前は捨て、足りない台は末尾に足し、送り口と戻り口を一つずつ置く。
     戻り口は列の最後に固定する。アンプへ戻った先はスピーカーなので、
     そこに台は入らず、末尾以外の位置は成り立たないため。 */
  function fixLine(){
    var out=[],seen={};
    LINE.forEach(function(id){
      if(id==='amp') id=SEND;                 /* 以前の一枚札からの引き継ぎ */
      if(seen[id]) return;
      if(isAmp(id)||pedalOf(id)){ out.push(id); seen[id]=1; }
    });
    if(!seen[SEND]) out.push(SEND);
    PEDALS.forEach(function(p){ if(!seen[p.id]) out.push(p.id); });
    out=out.filter(function(id){ return id!==RET; });
    out.push(RET);
    LINE=out;
  }
  fixLine();
  function sendIndex(){ return LINE.indexOf(SEND); }
  function isPre(id){
    var i=LINE.indexOf(id);
    return i>=0 && i<sendIndex();
  }
  /* 送り口と戻り口に挟まれた台が、ループの中を通る台 */
  function loopIds(){ return LINE.slice(sendIndex()+1,LINE.length-1); }
  function chainOrder(){
    return LINE.filter(function(id){ return !isAmp(id); });
  }
  function zoneOf(id){
    return isPre(id)
      ? {id:'pre',  name:'アンプの前'}
      : {id:'post', name:'FXループの中'};
  }
  function lineStateText(){
    var pre=sendIndex(), loop=LINE.length-pre-2;
    if(loop===0) return '一本道・全'+pre+'台';
    if(pre===0)  return '全'+loop+'台がループの中';
    return 'アンプの前 '+pre+'台 ／ ループ '+loop+'台';
  }
  /* 一台を、別の台の位置へ移す。
     右へ動かした時はその台の後ろ、左へ動かした時は前に入れる。
     戻り口より後ろには置けないので、動かした後で末尾へ戻す */
  function moveInLine(id,targetId){
    if(id===RET) return false;
    var from=LINE.indexOf(id), to=LINE.indexOf(targetId);
    if(from<0||to<0||from===to) return false;
    LINE.splice(from,1);
    var t=LINE.indexOf(targetId);
    LINE.splice(from<to?t+1:t,0,id);
    LINE=LINE.filter(function(x){ return x!==RET; });
    LINE.push(RET);
    keepLine();
    return true;
  }
  /* 指定した隙間へ入れる。k は今の並びの中で「この台の手前」を指す。
     自分の元の場所と同じ隙間なら、動かさない */
  function moveToGap(id,k){
    if(id===RET) return false;
    var from=LINE.indexOf(id);
    if(from<0||k<0) return false;
    if(k===from||k===from+1) return false;
    var arr=LINE.slice();
    arr.splice(from,1);
    arr.splice(k>from?k-1:k,0,id);
    arr=arr.filter(function(x){ return x!==RET; });
    arr.push(RET);
    LINE=arr; keepLine();
    return true;
  }
  /* 二台の場所をそっくり交換する。割り込みと違い、周りの並びは動かない */
  function swapInLine(a,b){
    if(!a||!b||a===b||a===RET||b===RET) return false;
    var i=LINE.indexOf(a), j=LINE.indexOf(b);
    if(i<0||j<0) return false;
    LINE[i]=b; LINE[j]=a;
    keepLine();
    return true;
  }
  function resetLine(){
    LINE=DEFAULT_LINE.slice(); fixLine(); keepLine();
  }
  function miniOf(p){
    var m=document.createElement('div');
    m.className='mini';
    m.style.background='linear-gradient(178deg,'+p.theme.top+' 0%,'+p.theme.mid+' 45%,'+p.theme.bot+' 100%)';
    m.style.setProperty('--led',p.theme.led);
    m.innerHTML=p.mini;
    return m;
  }

  /* ══════ 音の道を組み直す ══════
     踏んだ台を、繋ぐ順どおりに数珠つなぎで挿す。
     アンプの前の台は 弦→台…→アンプ、後の台は アンプ→台…→出口。
     一台だけ開いて確かめている時は、その台だけを通す。 */
  var soloId=null;
  function activeIds(){
    var order=chainOrder();
    if(soloId) return [soloId];
    return order.filter(function(id){
      var p=pedalOf(id);
      return p&&p.isOn&&p.isOn();
    });
  }
  function rewire(){
    if(!AC) return;
    try{ BUS.disconnect(); }catch(e){}
    try{ TRIM.disconnect(); }catch(e){}
    PEDALS.forEach(function(p){ if(p.detach) p.detach(); });
    var ids=activeIds();
    var pre=[],post=[];
    ids.forEach(function(id){
      var p=pedalOf(id);
      (isPre(id)?pre:post).push(p);
    });
    /* アンプの前 */
    var node=BUS;
    pre.forEach(function(p){
      FXIN=AC.createGain(); FXOUT=AC.createGain();
      node.connect(FXIN);
      p.rebuild();
      node=FXOUT;
    });
    node.connect(AMPIN);
    /* アンプの後 */
    var tail=TRIM;
    post.forEach(function(p){
      FXIN=AC.createGain(); FXOUT=AC.createGain();
      tail.connect(FXIN);
      p.rebuild();
      tail=FXOUT;
    });
    tail.connect(LIMIT||MASTER);
    paintCables();
  }

  /* ══════ 板に並べる ══════
     繋ぐ順は、右上 → その真下 → 一つ左の上 → その真下、と左へ進む。
     実物のボードでよく取られる組み方で、シールドの取り回しが短くて済む。 */
  function layout(){
    /* ══ 並び ══
       ギターは右端。上段を右から左へ通し、左端で下段の右端へ折り返し、
       下段も右から左へ。最後にアンプへ入る。
       上下をまたぐのは折り返しの一本だけで、直列であることが目で追える。 */
    var line=LINE.slice(), half=Math.ceil(line.length/2);
    return {
      top:line.slice(0,half),         /* 右から左へ並べる（描画側で反転）*/
      bottom:line.slice(half),
      order:line,
      cols:half
    };
  }
  /* ══════ 並べ替え ══════
     絵を横へドラッグすると、台と台の<隙間>へ入る。
     指を近づけた隙間が実際に開き、そこへ入ることが見て分かる。
     踏み板のある台は、指を置いた場所で用途が決まる（上半分は踏み板）。

     位置の割り出しには、掴んだ時点で測った座標を使う。
     隙間が開くと絵の位置が動くので、その都度測り直すと
     開いたり閉じたりを繰り返してしまうため。 */
  var dragId=null, dropAt=-1, swapId=null, gapEl=null, snap=null;

  function takeSnapshot(){
    var board=el('board');
    if(!board) return null;
    var rows=[], all=[];
    var rowEls=board.querySelectorAll('.rows .row');
    for(var i=0;i<rowEls.length;i++){
      var rr=rowEls[i].getBoundingClientRect();
      var its=rowEls[i].querySelectorAll('.slot[data-pedal]');
      var list=[];
      for(var j=0;j<its.length;j++){
        var r=its[j].getBoundingClientRect();
        list.push({el:its[j], id:its[j].getAttribute('data-pedal'),
                   l:r.left, r:r.right, cx:(r.left+r.right)/2});
        all.push(its[j]);
      }
      if(list.length) rows.push({el:rowEls[i], mid:(rr.top+rr.bottom)/2, items:list});
    }
    return rows.length?{rows:rows, all:all}:null;
  }

  /* 指の位置から、落とし先を割り出す。二通りある。
       台の真ん中あたりに重ねた時  → その台と入れ替える
       台と台の隙間に寄せた時      → その隙間へ割り込む
     段は縦の位置で選ぶ。段の中は右から左へ並んでいるので、
     指より左に中心がある最初の台が、その隙間の左隣にあたる */
  var SWAP_BAND=0.3;                           /* 真ん中の六割を入れ替えの的にする */
  function aimAt(x,y){
    if(!snap) return null;
    var row=snap.rows[0], bd=Infinity, i;
    for(i=0;i<snap.rows.length;i++){
      var d=Math.abs(y-snap.rows[i].mid);
      if(d<bd){ bd=d; row=snap.rows[i]; }
    }
    for(i=0;i<row.items.length;i++){
      var it=row.items[i];
      if(x>=it.l&&x<=it.r){
        if(Math.abs(x-it.cx)<(it.r-it.l)*SWAP_BAND&&it.id!==dragId&&it.id!==RET)
          return {kind:'swap', id:it.id, el:it.el};
        break;
      }
    }
    var base=snap.all.indexOf(row.items[0].el);
    var k=base+row.items.length;               /* 既定はその段の左端＝一番後ろ */
    for(i=0;i<row.items.length;i++){
      if(x>row.items[i].cx){ k=base+i; break; }
    }
    if(k>snap.all.length-1) k=snap.all.length-1;   /* 戻り口より後ろへは入れない */
    return {kind:'gap', index:k, row:row};
  }

  /* 入れ替えの的。その台に枠を出す */
  function markSwap(el){
    var ss=document.querySelectorAll('.slot[data-pedal]');
    for(var i=0;i<ss.length;i++) ss[i].classList.remove('drop');
    swapId=null;
    if(el){ el.classList.add('drop'); swapId=el.getAttribute('data-pedal'); }
  }
  function showAim(aim){
    if(!aim){ markSwap(null); hideGap(); return; }
    if(aim.kind==='swap'){
      if(gapEl&&gapEl.parentNode){ hideGap(); drawWire(); }
      markSwap(aim.el);
      return;
    }
    markSwap(null);
    showGap(aim);
  }
  function showGap(spot){
    if(!spot){ hideGap(); return; }
    if(spot.index===dropAt&&gapEl&&gapEl.parentNode) return;
    if(!gapEl){
      gapEl=document.createElement('div');
      gapEl.className='drop-gap';
      gapEl.setAttribute('aria-hidden','true');
    }
    var ref=snap.all[spot.index];
    if(ref&&ref.parentNode===spot.row.el) spot.row.el.insertBefore(gapEl,ref);
    else{
      var last=spot.row.items[spot.row.items.length-1].el;
      spot.row.el.insertBefore(gapEl,last.nextSibling);
    }
    dropAt=spot.index;
    gapEl.classList.add('open');
    drawWire();                                 /* 線も隙間に合わせて引き直す */
  }
  function hideGap(){
    if(gapEl&&gapEl.parentNode) gapEl.parentNode.removeChild(gapEl);
    dropAt=-1;
  }
  function clearDrag(){
    var ss=document.querySelectorAll('.slot[data-pedal]');
    for(var i=0;i<ss.length;i++){
      ss[i].classList.remove('lift'); ss[i].classList.remove('drop');
    }
    hideGap(); gapEl=null; snap=null; dragId=null; swapId=null;
  }

  /* 絵に、押す・傾ける・並べ替えるの三つをまとめて付ける */
  function wireHandle(box,handle,id,p){
    var down=false, mode=null, sx=0, sy=0, lastY=0;
    var moved={v:false};
    var zone=null;
    handle.addEventListener('pointerdown',function(e){
      down=true; mode=null; moved.v=false; zone=null;
      sx=e.clientX; sy=e.clientY; lastY=e.clientY;
      if(p&&p.treadle&&e.target&&e.target.closest){
        if(e.target.closest('.tread-zone')) zone='tread';
        else if(e.target.closest('.order-zone')) zone='move';
      }
      if(handle.setPointerCapture) handle.setPointerCapture(e.pointerId);
    });
    handle.addEventListener('pointermove',function(e){
      if(!down) return;
      var dx=e.clientX-sx, dy=e.clientY-sy;
      if(mode===null){
        if(Math.abs(dx)<6&&Math.abs(dy)<6) return;
        /* 踏み板のある台は、指を置いた場所で決める。
           絵の上半分なら踏み板、下半分なら並べ替え。
           それ以外の台は、絵のどこを持っても並べ替えになる */
        mode=zone||'move';
        if(mode==='move'){
          dragId=id; snap=takeSnapshot(); box.classList.add('lift');
        }
        moved.v=true;
      }
      if(mode==='move'){
        showAim(aimAt(e.clientX,e.clientY));
        e.preventDefault();
      }else if(mode==='tread'){
        p.treadle.set(p.treadle.get()+(lastY-e.clientY)*0.012);
        lastY=e.clientY;
        paintTreadle(box,p);
        e.preventDefault();
      }
    });
    function finish(){
      down=false;
      if(mode==='move'){
        var who=dragId, at=dropAt, sw=swapId;
        clearDrag();
        var done=sw ? swapInLine(who,sw)
                    : (who&&at>=0&&moveToGap(who,at));
        if(done){
          buildMap();
          if(AC) rewire();
        }else{
          drawWire();
        }
      }
      mode=null;
    }
    handle.addEventListener('pointerup',finish);
    handle.addEventListener('pointercancel',function(){
      down=false; mode=null; clearDrag(); drawWire();
    });
    /* 指を使わずに済むよう、鍵盤からも動かせるようにする */
    handle.addEventListener('keydown',function(e){
      var big=e.shiftKey;
      if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
        if(!big&&p&&p.treadle){
          p.treadle.set(p.treadle.get()+(e.key==='ArrowRight'?0.05:-0.05));
          paintTreadle(box,p); e.preventDefault(); return;
        }
        /* Shift＋左右で並べ替え。図の並びは右から左なので、左キーで後ろへ送る */
        var i=LINE.indexOf(id), j=i+(e.key==='ArrowLeft'?1:-1);
        if(i<0||j<0||j>=LINE.length) return;
        if(moveInLine(id,LINE[j])){
          buildMap();
          if(AC) rewire();
          var again=document.querySelector('.slot[data-pedal="'+id+'"] .slot-open');
          if(again) again.focus();
        }
        e.preventDefault(); return;
      }
      if(p&&p.treadle&&(e.key==='ArrowUp'||e.key==='ArrowDown')){
        p.treadle.set(p.treadle.get()+(e.key==='ArrowUp'?0.05:-0.05));
        paintTreadle(box,p); e.preventDefault();
      }
    });
    return moved;
  }

  function slotOf(p,n){
    var b=document.createElement('div');
    b.className='slot'; b.setAttribute('data-pedal',p.id);
    if(p.treadle) b.classList.add('trd');
    var no=document.createElement('div');
    no.className='no'; no.textContent=(n<10?'0':'')+n;
    var nm=document.createElement('div');
    nm.className='name'; nm.textContent=p.name;
    var m=miniOf(p);
    /* 右がIN、左がOUT。実物と同じ並びにする */
    var jk=document.createElement('div');
    jk.className='jacks';
    jk.innerHTML='<span class="jk in"></span><span class="jk-lbl in">IN</span>'+
                 '<span class="jk out"></span><span class="jk-lbl out">OUT</span>';
    m.appendChild(jk);
    /* 絵を押すと開く。横へドラッグすると並べ替え。下の踏みスイッチで音の道へ挿す */
    var open=document.createElement('button');
    open.className='slot-open'; open.type='button';
    open.setAttribute('aria-label', p.name+'を開く（'+
      (p.treadle?'絵の上半分を上下にドラッグで踏み板、下半分を横にドラッグで並べ替え'
                :'絵を横にドラッグで並べ替え')+'）');
    open.appendChild(m);
    var moved=wireHandle(b,open,p.id,p);
    open.addEventListener('click',function(){
      if(moved.v){ moved.v=false; return; }   /* ドラッグの後は開かない */
      openPedal(p.id);
    });
    var sw=document.createElement('button');
    sw.className='slot-sw'; sw.type='button';
    sw.setAttribute('role','switch');
    sw.setAttribute('aria-label',p.name+'の入切');
    sw.innerHTML='<span class="dot"></span><span class="tx">切</span>';
    sw.addEventListener('click',function(){
      ensureAudio();
      if(p.setOn) p.setOn(!(p.isOn&&p.isOn()));
      paintSwitches(); updateOnCount(); rewire();
    });
    b.appendChild(no); b.appendChild(open); b.appendChild(nm); b.appendChild(sw);
    if(p.treadle){
      /* 上半分は踏み板、下半分は並べ替え。指を置いた場所で用途が決まる */
      var zt=document.createElement('div');
      zt.className='grab tread-zone'; zt.setAttribute('aria-hidden','true');
      var zo=document.createElement('div');
      zo.className='grab order-zone'; zo.setAttribute('aria-hidden','true');
      m.appendChild(zt); m.appendChild(zo);
      var val=document.createElement('div');
      val.className='slot-val';
      b.appendChild(val);
      paintTreadle(b,p);
    }
    return b;
  }

  /* ══ 列の中のアンプ ══
     アンプは送り口（SEND）と戻り口（RETURN）の二枚に分けて置く。
     この二枚に挟まれた台が、FXループの中を通る台である。
     動かせるのは送り口だけ。戻り口の先はスピーカーなので末尾から動かない。
     送り口を戻り口の隣まで送れば、ループに何も入らない一本道になる。 */
  function ampArt(label,lamp){
    return '<svg viewBox="0 0 74 104">'+
      '<rect class="ln" x="8" y="16" width="58" height="60" rx="4"/>'+
      '<line class="ln" x1="8" y1="32" x2="66" y2="32"/>'+
      (lamp?'<circle class="lamp" cx="16" cy="24" r="2.4"/>'
           :'<circle class="ln" cx="16" cy="24" r="2.2"/>')+
      '<line class="thin" x1="24" y1="24" x2="58" y2="24"/>'+
      '<line class="thin" x1="16" y1="42" x2="58" y2="56"/>'+
      '<line class="thin" x1="16" y1="50" x2="58" y2="64"/>'+
      '<line class="thin" x1="16" y1="58" x2="50" y2="70"/>'+
      '<text x="37" y="90" text-anchor="middle">'+label+'</text>'+
      '<text class="sm" x="37" y="99" text-anchor="middle">AMP</text>'+
    '</svg>';
  }
  function ampCard(which){
    var out=(which===SEND);
    var b=document.createElement('div');
    b.className='slot amp-slot '+(out?'amp-send':'amp-ret');
    b.setAttribute('data-pedal',which);
    var no=document.createElement('div');
    no.className='no'; no.textContent='──';
    var nm=document.createElement('div');
    nm.className='name'; nm.textContent=out?'アンプ・送り':'アンプ・戻り';
    var m=document.createElement('div');
    m.className='mini amp-mini';
    m.innerHTML=ampArt(out?'SEND':'RETURN',out);
    var jk=document.createElement('div');
    jk.className='jacks';
    jk.innerHTML=out
      ? '<span class="jk in"></span><span class="jk-lbl in">IN</span>'+
        '<span class="jk out"></span><span class="jk-lbl out">SEND</span>'
      : '<span class="jk in"></span><span class="jk-lbl in">RET</span>'+
        '<span class="jk out"></span><span class="jk-lbl out">OUT</span>';
    m.appendChild(jk);
    var open=document.createElement('button');
    open.className='slot-open'; open.type='button';
    open.setAttribute('aria-label',out
      ? 'アンプの送り口（横にドラッグでループの入口を動かす）'
      : 'アンプの戻り口（位置は変えられません）');
    open.appendChild(m);
    var moved={v:false};
    if(out) moved=wireHandle(b,open,SEND,null);
    open.addEventListener('click',function(){
      if(moved.v){ moved.v=false; return; }
      openGuide(2);
    });
    var note=document.createElement('div');
    note.className='amp-note';
    note.textContent=out?'ここから先がループ':'ここでアンプへ戻る';
    b.appendChild(no); b.appendChild(open); b.appendChild(nm); b.appendChild(note);
    return b;
  }
  /* 踏み板の傾きと読みを塗り直す */
  function paintTreadle(slot,p){
    if(!slot||!p||!p.treadle) return;
    var g=slot.querySelector('.mini .trd');
    if(g) g.setAttribute('transform','rotate('+(-2-12*p.treadle.get()).toFixed(1)+' 37 38)');
    var v=slot.querySelector('.slot-val');
    if(v) v.textContent=p.treadle.text();
  }
  function paintTreadles(){
    var ss=document.querySelectorAll('.slot.trd');
    for(var i=0;i<ss.length;i++)
      paintTreadle(ss[i],pedalOf(ss[i].getAttribute('data-pedal')));
  }
  /* 踏みスイッチと、線の明るさを塗り直す */
  function paintSwitches(){
    var slots=document.querySelectorAll('.slot');
    for(var i=0;i<slots.length;i++){
      var id=slots[i].getAttribute('data-pedal'), p=pedalOf(id);
      var on=!!(p&&p.isOn&&p.isOn());
      slots[i].classList.toggle('on',on);
      var sw=slots[i].querySelector('.slot-sw');
      if(sw){
        sw.setAttribute('aria-checked',on?'true':'false');
        var tx=sw.querySelector('.tx');
        if(tx) tx.textContent=on?'入':'切';
      }
    }
  }
  function updateOnCount(){
    var n=chainOrder().filter(function(id){
      var p=pedalOf(id); return p&&p.isOn&&p.isOn();
    }).length;
    var e2=el('onCount');
    if(!e2) return;
    e2.textContent=soloId?'この一台だけ':(n?(n+'台 入'):'全台 素通り');
  }
  function paintCables(){
    var svg=el('wire');
    if(svg) svg.classList.toggle('live',activeIds().length>0);
  }
  function jack(lbl,sub,kind){
    var j=document.createElement('div');
    j.className='jack '+(kind||'');
    var fig=document.createElement('div');
    fig.className='fig';
    if(kind==='in'){

      fig.innerHTML=
        '<svg viewBox="0 0 92 56" width="92" height="56">'+
          '<path d="M30 28c0-11 7-19 16-19 7 0 12 4 14 9 2 5 6 8 12 8s10-3 12-8"/>'+
          '<path d="M30 28c0 11 7 19 16 19 7 0 12-4 14-9 2-5 6-8 12-8"/>'+
          '<circle cx="52" cy="28" r="6"/>'+
          '<line x1="30" y1="24" x2="6" y2="24"/>'+
          '<line x1="30" y1="32" x2="6" y2="32"/>'+
          '<path d="M6 20h-4v16h4z"/>'+
          '<line class="thin" x1="12" y1="26" x2="26" y2="26"/>'+
          '<line class="thin" x1="12" y1="30" x2="26" y2="30"/>'+
        '</svg>'+
        '<span class="jackpt" style="right:-4px;top:50%;margin-top:-4.5px"></span>';
    }else{

      fig.innerHTML=
        '<svg viewBox="0 0 78 58" width="78" height="58">'+
          '<rect x="4" y="4" width="70" height="50" rx="4"/>'+
          '<line x1="4" y1="18" x2="74" y2="18"/>'+
          '<circle cx="14" cy="11" r="2.5"/>'+
          '<line class="thin" x1="24" y1="11" x2="66" y2="11"/>'+
          '<line class="thin" x1="12" y1="26" x2="66" y2="42"/>'+
          '<line class="thin" x1="12" y1="34" x2="66" y2="50"/>'+
          '<line class="thin" x1="12" y1="42" x2="52" y2="53"/>'+
        '</svg>'+
        '<span class="jackpt" style="right:-4px;top:50%;margin-top:-4.5px"></span>';
    }
    j.appendChild(fig);
    var l=document.createElement('div'); l.className='lbl'; l.textContent=lbl;
    var b=document.createElement('div'); b.className='sub'; b.innerHTML=sub;
