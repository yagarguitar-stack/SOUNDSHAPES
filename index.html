          '<line x1="4" y1="18" x2="74" y2="18"/>'+
          '<circle cx="14" cy="11" r="2.5"/>'+
          '<line class="thin" x1="24" y1="11" x2="66" y2="11"/>'+
          '<line class="thin" x1="12" y1="26" x2="66" y2="42"/>'+
          '<line class="thin" x1="12" y1="34" x2="66" y2="50"/>'+
          '<line class="thin" x1="12" y1="42" x2="52" y2="53"/>'+
        '</svg>'+
        '<span class="jackpt" style="right:-4px;top:50%;margin-top:-4.5px"></span>';

  }

  function buildMap(){
    var body=el('mapBody');
    body.innerHTML='';
    var L=layout();
    var rowT=document.createElement('div'); rowT.className='row';
    var rowB=document.createElement('div'); rowB.className='row';
    /* 段は右から左へ並ぶ（row-reverse）。先頭を先に足せば右端に来る */
    var ord=chainOrder();
    function itemOf(id){
      return isAmp(id)?ampCard(id):slotOf(pedalOf(id),ord.indexOf(id)+1);
    }
    rowT.appendChild(jack('ギター','ここから<br>出る','in'));
    L.top.forEach(function(id){ rowT.appendChild(itemOf(id)); });
    L.bottom.forEach(function(id){ rowB.appendChild(itemOf(id)); });
    rowB.appendChild(jack('スピーカー','ここから<br>鳴る','out'));  /* 下段の左端 */
    rowB.appendChild(guideSlot());                                 /* その隣に解説の札 */
    rowB.appendChild(sysSlot());                                   /* さらに隣に繋ぎ方の札 */
    body.appendChild(rowT); body.appendChild(rowB);
    el('count').textContent='全'+chainOrder().length+'台';
    var ls=el('lineState');
    if(ls) ls.textContent=lineStateText();
    paintSwitches(); updateOnCount();
    var note=el('boardNote');
    if(note) note.innerHTML=
      '右のギターから左へ、十三台とアンプを順に通って音が出ます。'+
      '列の中には<b>アンプの送り口と戻り口</b>があり、'+
      'その二枚に挟まれた台が青い枠の<b>FXループ</b>の中を通ります。<br>'+
      '<b>絵を横にドラッグすると並べ替えられます。</b>'+
      '隙間に寄せればそこへ割り込み、台の真ん中に重ねればその台と入れ替わります。'+
      '送り口も動かせますので、ループに入れる台を増やしたり減らしたりできます。'+
      'ワウとボリュームだけは、絵の<b>上半分が踏み板</b>、<b>下半分が並べ替え</b>です。'+
      '順番を変えると音も変わりますので、置き場所による違いを聞き比べてください。'+
      '板の左端に、考え方をまとめた<b>解説</b>を置いています。'+
      'その隣の<b>繋ぎ方</b>では、端子やアンプの仕組み、やりたいことからの逆引き、手持ちの機材で何ができるか、組み方の型、ギタリストの組み方を見られます。'+
      '右端のギターと左端のスピーカーの絵を押すと、<b>手持ちの機材の種類</b>を選べます。'+
      '点線の下線が付いた言葉は、押すと意味が出ます。<br>'+
      '各台の踏みスイッチで入切し、下の帯から鳴らします。'+
      '試し弾きの音は、ギターの物理模型ではなく、聴き比べのために作った<b>簡易な音源</b>です。';
    paintEnds();
    drawWire();
    var wrap=el('map');
    if(wrap) wrap.scrollLeft=wrap.scrollWidth;   /* 繋ぎ始めの右端を見せる */
  }

  /* ══════ パッチケーブルを引く ══════
     直線だけで引く。台の上は横切らせない。
     ・同じ段で隣り合う台は、側面どうしを水平に結ぶ
     ・段をまたぐ所は、台の外側で縦に折る直角の経路にする
     ・折り返しの縦線は、経路ごとに位置をずらして重ならないようにする */
  var dots=[], wirePath=null, wireLen=0, flow=null;
  function drawWire(){
    var svg=el('wire'), board=el('board');
    if(!svg||!board) return;
    var W=board.scrollWidth, H=board.scrollHeight;
    if(!W||!H) return;
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    svg.setAttribute('width',W); svg.setAttribute('height',H);
    svg.innerHTML='';
    var base=board.getBoundingClientRect();
    function box(node){
      var r=node.getBoundingClientRect();
      return {l:r.left-base.left, r:r.right-base.left, t:r.top-base.top, b:r.bottom-base.top,
              cy:r.top-base.top+r.height/2};
    }
    /* 穴の位置をそのまま線の端にする。
       台は右がIN、左がOUT。線はOUTから次のINへ渡る。 */
    /* 台は右がIN、左がOUT。端子（ギター・アンプ）は絵に描いた挿し口を使う */
    function port(node,side){
      var j=node.querySelector('.jackpt');
      if(!j){
        var sel=(side==='left')?'.jk.out':'.jk.in';
        j=node.querySelector(sel)||node.querySelector('.mini')||node;
      }
      var r=j.getBoundingClientRect();
      return {x:r.left-base.left+r.width/2, y:r.top-base.top+r.height/2};
    }
    drawLoopBand(svg,board,base);
    var L=layout(), jacks=board.querySelectorAll('.jack');
    var nodes=[];
    if(jacks[0]) nodes.push({el:jacks[0], kind:'jack'});
    L.order.forEach(function(id){
      var n=board.querySelector('.slot[data-pedal="'+id+'"]');
      if(n) nodes.push({el:n, kind:'slot'});
    });
    if(jacks[1]) nodes.push({el:jacks[1], kind:'jack'});
    if(nodes.length<2) return;

    var d='', turn=0;
    for(var i=0;i<nodes.length-1;i++){
      var A=nodes[i].el, B=nodes[i+1].el;
      var a=port(A,'left'), b=port(B,'right');
      /* 右から左へ並ぶので、出口は左側、入口は右側 */
      var ab=box(A), bb=box(B);
      if(Math.abs(a.y-b.y)<24){
        /* 同じ段。斜めに走らせず、水平に引いてから穴の高さへ合わせる */
        d+=' M'+a.x.toFixed(1)+','+a.y.toFixed(1)+
           ' L'+b.x.toFixed(1)+','+a.y.toFixed(1);
        if(Math.abs(a.y-b.y)>0.5) d+=' L'+b.x.toFixed(1)+','+b.y.toFixed(1);
      }else{
        /* ══ 折り返し ══
           上段の左端（OUT）から出て、板の左の外で下へ降り、
           **上段と下段の間の空きを右へ走り**、下段の右端で下へ降りて
           その台の IN へ入る。
           台の裏を通すと線が隠れて繋がって見えないので、
           必ず段の間の空きを通す。 */
        turn++;
        var xLeft=Math.min(ab.l,bb.l)-14;              /* 上段の左の外 */
        var yMid=(ab.b+bb.t)/2;                        /* 上段と下段の間の空き */
        var xRight=b.x+14;                             /* 入口の右の外 */
        d+=' M'+a.x.toFixed(1)+','+a.y.toFixed(1)+
           ' L'+xLeft.toFixed(1)+','+a.y.toFixed(1)+
           ' L'+xLeft.toFixed(1)+','+yMid.toFixed(1)+
           ' L'+xRight.toFixed(1)+','+yMid.toFixed(1)+
           ' L'+xRight.toFixed(1)+','+b.y.toFixed(1)+
           ' L'+b.x.toFixed(1)+','+b.y.toFixed(1);
      }
    }
    var path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',d.trim());
    path.setAttribute('class','hi');
    svg.appendChild(path);
    wirePath=path;
    wireLen=path.getTotalLength?path.getTotalLength():0;
    dots=[];
    for(var q=0;q<3;q++){
      var c=document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('class','dot'); c.setAttribute('r','2.6');
      svg.appendChild(c);
      dots.push({node:c, at:q/3});
    }
    startFlow();
  }
  /* ══════ ループの囲み ══════
     送り口から戻り口までを破線で囲い、区間を目で分かるようにする。
     段をまたぐ時は段ごとに一つずつ。ループが空の時は描かない。 */
  function drawLoopBand(svg,board,base){
    var inner=loopIds();
    if(!inner.length) return;
    var rowEls=board.querySelectorAll('.row');
    var ids=[SEND].concat(inner).concat([RET]), rows={};

  /* 似た綴りで別の意味になる語。ここに当たった所は下線を引かない */
  var TERM_SKIP=['ヘッドホン','ヘッドフォン','ドライブ','ドライバー','ハムバッカー','マルチチャンネル'];
  var termRe=null, termOf={};
  (function(){
    var all=[];
    TERMS.forEach(function(t,i){
      t.id='t'+i;
      t.m.forEach(function(w){ termOf[w]=t; all.push(w); });
    });
    TERM_SKIP.forEach(function(w){ termOf[w]=null; all.push(w); });
    all.sort(function(a,b){ return b.length-a.length; });
    termRe=new RegExp(all.map(function(w){
      return w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    }).join('|'),'g');
  })();
  function termById(id){
    for(var i=0;i<TERMS.length;i++) if(TERMS[i].id===id) return TERMS[i];
    return null;
  }
  /* 文中の初出だけに下線を引く。見出しやボタンの中は触らない */
  function markTerms(root,skipId){
    if(!root) return;
    var seen={}; if(skipId) seen[skipId]=1;
    var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null,false);
    var list=[], n;
    while((n=walker.nextNode())) list.push(n);
    list.forEach(function(node){
      var p=node.parentNode;
      if(!p||!p.closest) return;
      if(p.closest('.term,button,a,input,.guide-h,.hn,.chain-line,.gl-name,.no-term,.sys-now')) return;
      var s=node.nodeValue, out=[], last=0, m, hit=false;
      termRe.lastIndex=0;
      while((m=termRe.exec(s))){
        var w=m[0], t=termOf[w];
        if(!t||seen[t.id]) continue;
        if(/^[A-Za-z]/.test(w)){
          var pc=s.charAt(m.index-1), nc=s.charAt(m.index+w.length);
          if(/[A-Za-z0-9\-]/.test(pc)||/[A-Za-z0-9\-]/.test(nc)) continue;
        }
        seen[t.id]=1; hit=true;
        if(m.index>last) out.push(document.createTextNode(s.slice(last,m.index)));
        var sp=document.createElement('span');
        sp.className='term'; sp.setAttribute('data-t',t.id);
        sp.setAttribute('role','button'); sp.setAttribute('tabindex','0');
        sp.textContent=w;
        out.push(sp);
        last=m.index+w.length;
      }
      if(!hit) return;
      if(last<s.length) out.push(document.createTextNode(s.slice(last)));
      var f=document.createDocumentFragment();
      out.forEach(function(x){ f.appendChild(x); });
      p.replaceChild(f,node);
    });
  }
  /* 意味を出す小窓 */
  var pop=null;
  function showTerm(anchor){
    var t=termById(anchor.getAttribute('data-t'));
    if(!t) return;
    if(!pop){
      pop=document.createElement('div');
      pop.className='term-pop'; pop.setAttribute('role','dialog');
      document.body.appendChild(pop);
    }
    pop.innerHTML='<div class="tp-h">'+t.n+'</div><div class="tp-d"></div>';
    pop.querySelector('.tp-d').textContent=t.d;
    markTerms(pop.querySelector('.tp-d'),t.id);
    pop.style.display='block';
    var r=anchor.getBoundingClientRect(), W=window.innerWidth, H=window.innerHeight;
    var w=Math.min(300,W-24);
    pop.style.width=w+'px';
    var x=Math.max(12,Math.min(W-w-12,r.left+r.width/2-w/2));
    pop.style.left=x+'px';
    var ph=pop.offsetHeight;
    var y=(r.bottom+8+ph<H-12)?(r.bottom+8):Math.max(12,r.top-8-ph);
    pop.style.top=y+'px';
  }
  function hideTerm(){ if(pop) pop.style.display='none'; }
  document.addEventListener('click',function(e){

      j.classList.add('pickable');

      j.setAttribute('aria-label',(pr[0]==='in'?'ギター側':'鳴らす側')+'の種類を選ぶ（いまは'+e.name+'）');
      if(!j.__end){
        j.__end=1;
        j.addEventListener('click',function(){ openEnds(pr[0]); });

          if(ev.key==='Enter'||ev.key===' '){ openEnds(pr[0]); ev.preventDefault(); }
        });

  function scnListHtml(){
    var h='<div class="guide-h">やりたいことから探す</div>'+

      '板の両端で手持ちの種類を選んでおくと、それに合わせた一言も添えます。';
    SCN_CATS.forEach(function(c,ci){
      h+='<span class="hn">'+esc(c)+'</span><div class="sys-list" style="margin-top:4px">';
      SCN.forEach(function(s){
        if(s.cat!==ci) return;
        h+='<button type="button" class="sys-card" data-scn="'+s.id+'"><span class="sc-n">'+esc(s.q)+'</span></button>';
      });

    });
    return h;
  }
  function scnFit(s){
    if(!s.fit) return '';
    var o=s.fit[ends.out], g=s.fit[ends.in];
    var t=[];
    if(o) t.push(esc(o));
    if(g) t.push(esc(g));
    if(!t.length) return '';
    var who=[];
    if(o) who.push(endOf('out').name);
    if(g) who.push(endOf('in').name);
    return '<span class="hn">いま選んでいる機材では</span>'+
      '<span class="sys-now">'+esc(who.join('・'))+'</span>'+t.join('');
  }

    return '<ul class="sys-ul">'+list.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul>';

  function judge(set,id){
    if(ONLY[id]&&!okAny(set,ONLY[id])) return {na:true,miss:[],soft:[],have:[]};
    var list=NEEDS[id]||[], miss=[], soft=[], have=[];
    list.forEach(function(nd){

    if(h('cab')&&!h('head')&&!h('poweramp')&&!(h('multi')&&h('loop')))
      f.push({id:'poweramp',why:h('multi')?'ギタープロセッサーの音で、持っているキャビネットを鳴らせるようになります。':'持っているキャビネットを鳴らせるようになります。'});

  /* 一つ足すと、できることがいくつ増えるか */
  function bestBuys(){
    var base={}, out=[];
    SCN.forEach(function(s){ var j=judge(gear,s.id); base[s.id]=(!j.na&&!j.diag&&!j.miss.length); });
    Object.keys(GEAR_ITEM).forEach(function(id){
      var it=GEAR_ITEM[id];
      if(!it.buy||hasIn(gear,id)) return;
      var t={}; for(var k in gear) t[k]=gear[k]; t[id]=true;
      var gain=[];
      SCN.forEach(function(s){
        if(base[s.id]||judge(gear,s.id).na) return;
        var j=judge(t,s.id);
        if(!j.diag&&!j.miss.length) gain.push(s.q);
      });
      if(gain.length) out.push({id:id,n:it.bn||it.n,gain:gain});
    });
    out.sort(function(a,b){ return b.gain.length-a.gain.length; });
    var fx=gearFix(), seen={}, top=[];
    fx.forEach(function(x){
      if(seen[x.id]) return; seen[x.id]=1;
      var o=null; out.forEach(function(y){ if(y.id===x.id) o=y; });
      top.push({id:x.id,n:GEAR_ITEM[x.id].bn||GEAR_ITEM[x.id].n,first:x.why,gain:o?o.gain:[]});
    });
    out.forEach(function(y){ if(!seen[y.id]){ seen[y.id]=1; top.push(y); } });
    return top.slice(0,3);
  }

      if(p.setOn) p.setOn(t.preset.on.indexOf(p.id)>=0);
    });
    if(t.preset.out){ ends.out=t.preset.out; keepEnds(); }
    closeSys();
    buildMap();
    if(AC) rewire();
  }
  function openSys(){
    closeAllPanels();
    paintSys();
    el('sys').classList.add('on');
    el('map').classList.add('dim');
    document.body.style.overflow='hidden';
  }
  function closeSys(){
    el('sys').classList.remove('on');
    el('map').classList.remove('dim');
    document.body.style.overflow='';
    hideTerm();
  }
  function closeAllPanels(){
    if(current) closePedal();
    if(el('guide').classList.contains('on')) closeGuide();
    el('sys').classList.remove('on');
    el('ends').classList.remove('on');
    hideTerm();
  }
  el('sClose').addEventListener('click',closeSys);
  el('sPrev').addEventListener('click',function(){ if(sys.page>0){ sys.page--; paintSys(); } });
  el('sNext').addEventListener('click',function(){ if(sys.page<BASICS.length-1){ sys.page++; paintSys(); } });
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape') return;
    if(pop&&pop.style.display==='block') return;
    if(el('sys').classList.contains('on')){ closeSys(); e.preventDefault(); }
    else if(el('ends').classList.contains('on')){ closeEnds(); e.preventDefault(); }
  });
  /* 解説の札の隣に置く、繋ぎ方の札 */
  function sysSlot(){
    var d=document.createElement('div');
    d.className='guide-slot';
    var b=document.createElement('button');
    b.className='guide-btn'; b.type='button';
    b.setAttribute('aria-label','機材の繋ぎ方を読む');
    b.innerHTML='<svg viewBox="0 0 34 26" width="34" height="26">'+
        '<rect x="2" y="9" width="8" height="8"/><rect x="24" y="9" width="8" height="8"/>'+
        '<path d="M10 13h4c2 0 2-6 4-6s2 12 4 12 2-6 2-6"/>'+
        '<line class="thin" x1="6" y1="3" x2="6" y2="9"/><line class="thin" x1="28" y1="17" x2="28" y2="23"/>'+
      '</svg><span>繋ぎ方</span>';
    b.addEventListener('click',openSys);
    var c=document.createElement('div');
    c.className='cap'; c.textContent='機材と端子';
    d.appendChild(b); d.appendChild(c);
    return d;
  }

  buildMap();
  paintSwitches(); updateOnCount();
  drawTone(); drawArt(); drawPh();
  window.addEventListener('resize',function(){ drawWire(); });
  if(window.requestAnimationFrame) window.requestAnimationFrame(drawWire);

  window.__map={st:st,PEDALS:PEDALS,LINE:function(){ return LINE.slice(); },TONES:TONES,ARTS:ARTS,PHRASES:PHRASES,
                chainOrder:chainOrder,zoneOf:zoneOf,paintTreadles:paintTreadles,moveInLine:function(a,b){ return moveInLine(a,b); },moveToGap:function(a,k){ return moveToGap(a,k); },swapInLine:function(a,b){ return swapInLine(a,b); },resetLine:resetLine,sendIndex:sendIndex,loopIds:loopIds,layout:layout,drawWire:function(){ drawWire(); },
                openPedal:openPedal,closePedal:closePedal,
                activeIds:function(){ return activeIds(); },rewire:function(){ rewire(); },
                soloId:function(){ return soloId; },
                step:step,phraseOf:phraseOf,helpParts:helpParts,
                docPage:function(){ return docPage; },
                showDocPage:function(n){ docPage=n; showDoc(); }};
})();
</script>
