  function buildMap(){
    var body=el('mapBody');
    body.innerHTML='';
    var L=layout();
    var rowT=document.createElement('div'); rowT.className='row';
    var rowB=document.createElement('div'); rowB.className='row';
    /* 段は右から左へ並ぶ（row-reverse）。先頭を先に足せば右端に来る */
    var ord=chainOrder();
    function itemOf(id){
      return isAmp(id)?ampCard(id):slotOf(pedalOf(id),ord.indexOf(id)+1);
    }
    rowT.appendChild(jack('ギター','ここから<br>出る','in'));
    L.top.forEach(function(id){ rowT.appendChild(itemOf(id)); });
    L.bottom.forEach(function(id){ rowB.appendChild(itemOf(id)); });
    rowB.appendChild(jack('スピーカー','ここから<br>鳴る','out'));  /* 下段の左端 */
    rowB.appendChild(guideSlot());                                 /* その隣に解説の札 */
    body.appendChild(rowT); body.appendChild(rowB);
    el('count').textContent='全'+chainOrder().length+'台';
    var ls=el('lineState');
    if(ls) ls.textContent=lineStateText();
    paintSwitches(); updateOnCount();
    var note=el('boardNote');
    if(note) note.innerHTML=
      '右のギターから左へ、十三台とアンプを順に通って音が出ます。'+
      '列の中には<b>アンプの送り口と戻り口</b>があり、'+
      'その二枚に挟まれた台が青い枠の<b>FXループ</b>の中を通ります。<br>'+
      '<b>絵を横にドラッグすると並べ替えられます。</b>'+
      '隙間に寄せればそこへ割り込み、台の真ん中に重ねればその台と入れ替わります。'+
      '送り口も動かせますので、ループに入れる台を増やしたり減らしたりできます。'+
      'ワウとボリュームだけは、絵の<b>上半分が踏み板</b>、<b>下半分が並べ替え</b>です。'+
      '順番を変えると音も変わりますので、置き場所による違いを聞き比べてください。'+
      '板の左端に、考え方をまとめた<b>解説</b>を置いています。<br>'+
      '各台の踏みスイッチで入切し、下の帯から鳴らします。'+
      '試し弾きの音は、ギターの物理模型ではなく、聴き比べのために作った<b>簡易な音源</b>です。';
    drawWire();
    var wrap=el('map');
    if(wrap) wrap.scrollLeft=wrap.scrollWidth;   /* 繋ぎ始めの右端を見せる */
  }

  /* ══════ パッチケーブルを引く ══════
     直線だけで引く。台の上は横切らせない。
     ・同じ段で隣り合う台は、側面どうしを水平に結ぶ
     ・段をまたぐ所は、台の外側で縦に折る直角の経路にする
     ・折り返しの縦線は、経路ごとに位置をずらして重ならないようにする */
  var dots=[], wirePath=null, wireLen=0, flow=null;
  function drawWire(){
    var svg=el('wire'), board=el('board');
    if(!svg||!board) return;
    var W=board.scrollWidth, H=board.scrollHeight;
    if(!W||!H) return;
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    svg.setAttribute('width',W); svg.setAttribute('height',H);
    svg.innerHTML='';
    var base=board.getBoundingClientRect();
    function box(node){
      var r=node.getBoundingClientRect();
      return {l:r.left-base.left, r:r.right-base.left, t:r.top-base.top, b:r.bottom-base.top,
              cy:r.top-base.top+r.height/2};
    }
    /* 穴の位置をそのまま線の端にする。
       台は右がIN、左がOUT。線はOUTから次のINへ渡る。 */
    /* 台は右がIN、左がOUT。端子（ギター・アンプ）は絵に描いた挿し口を使う */
    function port(node,side){
      var j=node.querySelector('.jackpt');
      if(!j){
        var sel=(side==='left')?'.jk.out':'.jk.in';
        j=node.querySelector(sel)||node.querySelector('.mini')||node;
      }
      var r=j.getBoundingClientRect();
      return {x:r.left-base.left+r.width/2, y:r.top-base.top+r.height/2};
    }
    drawLoopBand(svg,board,base);
    var L=layout(), jacks=board.querySelectorAll('.jack');
    var nodes=[];
    if(jacks[0]) nodes.push({el:jacks[0], kind:'jack'});
    L.order.forEach(function(id){
      var n=board.querySelector('.slot[data-pedal="'+id+'"]');
      if(n) nodes.push({el:n, kind:'slot'});
    });
    if(jacks[1]) nodes.push({el:jacks[1], kind:'jack'});
    if(nodes.length<2) return;

    var d='', turn=0;
    for(var i=0;i<nodes.length-1;i++){
      var A=nodes[i].el, B=nodes[i+1].el;
      var a=port(A,'left'), b=port(B,'right');
      /* 右から左へ並ぶので、出口は左側、入口は右側 */
      var ab=box(A), bb=box(B);
      if(Math.abs(a.y-b.y)<24){
        /* 同じ段。斜めに走らせず、水平に引いてから穴の高さへ合わせる */
        d+=' M'+a.x.toFixed(1)+','+a.y.toFixed(1)+
           ' L'+b.x.toFixed(1)+','+a.y.toFixed(1);
        if(Math.abs(a.y-b.y)>0.5) d+=' L'+b.x.toFixed(1)+','+b.y.toFixed(1);
      }else{
        /* ══ 折り返し ══
           上段の左端（OUT）から出て、板の左の外で下へ降り、
           **上段と下段の間の空きを右へ走り**、下段の右端で下へ降りて
           その台の IN へ入る。
           台の裏を通すと線が隠れて繋がって見えないので、
           必ず段の間の空きを通す。 */
        turn++;
        var xLeft=Math.min(ab.l,bb.l)-14;              /* 上段の左の外 */
        var yMid=(ab.b+bb.t)/2;                        /* 上段と下段の間の空き */
        var xRight=b.x+14;                             /* 入口の右の外 */
        d+=' M'+a.x.toFixed(1)+','+a.y.toFixed(1)+
           ' L'+xLeft.toFixed(1)+','+a.y.toFixed(1)+
           ' L'+xLeft.toFixed(1)+','+yMid.toFixed(1)+
           ' L'+xRight.toFixed(1)+','+yMid.toFixed(1)+
           ' L'+xRight.toFixed(1)+','+b.y.toFixed(1)+
           ' L'+b.x.toFixed(1)+','+b.y.toFixed(1);
      }
    }
    var path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',d.trim());
    path.setAttribute('class','hi');
    svg.appendChild(path);
    wirePath=path;
    wireLen=path.getTotalLength?path.getTotalLength():0;
    dots=[];
    for(var q=0;q<3;q++){
      var c=document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('class','dot'); c.setAttribute('r','2.6');
      svg.appendChild(c);
      dots.push({node:c, at:q/3});
    }
    startFlow();
  }
  /* ══════ ループの囲み ══════
     送り口から戻り口までを破線で囲い、区間を目で分かるようにする。
     段をまたぐ時は段ごとに一つずつ。ループが空の時は描かない。 */
  function drawLoopBand(svg,board,base){
    var inner=loopIds();
    if(!inner.length) return;
    var rowEls=board.querySelectorAll('.row');
    var ids=[SEND].concat(inner).concat([RET]), rows={};
    ids.forEach(function(id){
      var n=board.querySelector('.slot[data-pedal="'+id+'"]');
      if(!n) return;
      var k=Array.prototype.indexOf.call(rowEls,n.parentNode);
      var r=n.getBoundingClientRect();
      var g=rows[k]||(rows[k]={l:1e9,r:-1e9,t:1e9,b:-1e9});
      g.l=Math.min(g.l,r.left-base.left);  g.r=Math.max(g.r,r.right-base.left);
      g.t=Math.min(g.t,r.top-base.top);    g.b=Math.max(g.b,r.bottom-base.top);
    });
    var pad=10;
    Object.keys(rows).forEach(function(k){
      var g=rows[k];
      if(g.r<g.l) return;
      var rect=document.createElementNS('http://www.w3.org/2000/svg','rect');
      rect.setAttribute('class','loopband');
      rect.setAttribute('x',(g.l-pad).toFixed(1));
      rect.setAttribute('y',(g.t-pad).toFixed(1));
      rect.setAttribute('width',(g.r-g.l+pad*2).toFixed(1));
      rect.setAttribute('height',(g.b-g.t+pad*2).toFixed(1));
      rect.setAttribute('rx','7');
      svg.appendChild(rect);
      var t=document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('class','looplbl');
      t.setAttribute('x',(g.r+pad-4).toFixed(1));
      t.setAttribute('y',(g.b+pad-3).toFixed(1));
      t.setAttribute('text-anchor','end');
      t.textContent='FX LOOP';
      svg.appendChild(t);
    });
  }
  /* 音が通っている印。繋いだ順に流れる */
  function startFlow(){
    if(flow) clearInterval(flow);
    var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    if(reduce||!wirePath||!wireLen) return;
    flow=setInterval(function(){
      if(!wirePath||!wirePath.getPointAtLength) return;
      dots.forEach(function(d){
        d.at+=0.0016;
        if(d.at>1) d.at-=1;
        var pt=wirePath.getPointAtLength(d.at*wireLen);
        d.node.setAttribute('cx',pt.x.toFixed(1));
        d.node.setAttribute('cy',pt.y.toFixed(1));
        var fade=Math.min(1,Math.min(d.at,1-d.at)*8);
        d.node.setAttribute('opacity',fade.toFixed(2));
      });
    },40);
  }
  /* ══════ 繋ぐ順の解説 ══════
     台の中ではなく、板そのものについての読み物。
     どの台をどこに置くか、なぜその順なのかをまとめる。
     板に載せなかった台と、音を出さない備品もここで扱う。 */
  var GUIDE=[
    /* 一枚目：順番が音を決める、という話 */
    '<div class="guide-h">なぜ順番で音が変わるのか</div>'+
    '<span class="lead">それぞれの台は、前の台が出した音を受け取って加工します。</span>'+
    'ですから同じ二台でも、どちらが先かで結果が変わります。'+
    'たとえば歪みの前で音量を絞ると、歪みへ入る音そのものが小さくなり、歪み方まで変わります。'+
    '歪みの後で絞れば、歪み方はそのままで音量だけが下がります。'+
    '同じ「絞る」でも、置く場所で意味が違います。'+
    '<span class="hn">よく使われる並び</span>'+
    '<div class="chain-line">'+
      '<i class="out">チューナー</i><s>→</s><i>ワウ</i><s>→</s><i>コンプ</i><s>→</s>'+
      '<i>歪み</i><s>→</s><i class="amp">アンプ</i><s>→</s>'+
      '<i>ノイズゲート</i><s>→</s><i>ボリューム</i><s>→</s><i>EQ</i>'+
    '</div>'+
    '<div class="chain-line">'+
      '<s>→</s><i>コーラス</i><s>→</s><i>フランジャー</i><s>→</s><i>フェイザー</i><s>→</s>'+
      '<i>トレモロ</i><s>→</s><i>ピッチ</i><s>→</s><i>ディレイ</i><s>→</s><i>リバーブ</i>'+
    '</div>'+
    '大きく分けると、<b>音の形と大きさを整える台</b>が先、'+
    '<b>揺らす台</b>が中ほど、<b>広げる台</b>が最後です。'+
    'この板もこの並びで始まります。'+
    'ただしこれは決まりではなく、多くの人が試した結果として残った出発点にすぎません。'+
    '<span class="hn">動かして確かめる</span>'+
    '板の絵を<b>横にドラッグする</b>と、台の位置を入れ替えられます。'+
    '列の中にあるアンプも動かせます。'+
    '入れ替えると音の道もその通りに繋ぎ直りますので、'+
    'この先の話はすべて、実際に耳で確かめられます。'+
    '元に戻したい時は、画面右上の「並びを戻す」を押してください。',

    /* 二枚目：前段 */
    '<div class="guide-h">アンプの前段</div>'+
    '<span class="hn">チューナー</span>'+
    '一番前、ギターのすぐ後ろに置きます。'+
    '他の台を通った後の音は加工されていて、音程が読み取りにくくなるためです。'+
    '踏むと音が消える機種が多く、曲の合間に音を出さずに合わせられます。'+
    'この板には台として載せていませんが、実際のボードではほぼ必ず一台目にあります。'+
    '<span class="hn">ワウ</span>'+
    '歪みの前が一般的です。'+
    '素の音の山を動かしてから歪ませたほうが、動きが素直に出ます。'+
    '<span class="hn">コンプ</span>'+
    '音量の凸凹をならす台なので、歪みより前に置いて入り口をそろえます。'+
    '歪みの後に置くと、歪みが作った音量差まで潰してしまいます。'+
    '<span class="hn">歪み</span>'+
    '複数を並べる時は、後ろほど全体の性格を決めます。'+
    '前の台が出した音を後ろの台が受け取って、さらに歪ませるからです。'+
    '軽いものを後ろに置いて重ねる、という組み方がよく使われます。'+
    '<span class="hn">ノイズゲート</span>'+
    '雑音を出す台の直後に置きます。'+
    '出どころより前に置いても、その後で足された雑音は通り抜けてしまいます。'+
    '<span class="hn">ボリューム</span>'+
    '歪みの後、空間系の前が基本です。'+
    'ここなら歪み方を変えずに、音量だけを動かせます。'+
    '<span class="hn">EQ</span>'+
    '歪みの後なら仕上げの調整、前なら歪み方そのものを変える道具になります。'+
    '同じ台が、置く場所で役目を変える良い例です。',

    /* 三枚目：後段と空間系 */
    '<div class="guide-h">揺らす台と、広げる台</div>'+
    '<span class="lead">揺れ物は歪みの後です。</span>'+
    'コーラス、フランジャー、フェイザー、トレモロは、いずれも音量や音程を細かく上下させます。'+
    'これを歪みの前に置くと、その上下を歪みが潰してしまい、動きが薄くなります。'+
    '<span class="hn">最後は空間系</span>'+
    'ディレイとリバーブは最後に置きます。'+
    '返ってきた音や残響をさらに歪ませたり揺らしたりすると、輪郭がぼやけるためです。'+
    'この二つの中では、ディレイが先、リバーブが後が一般的です。'+
    '返した音の一つひとつに残響が付き、自然な奥行きになります。'+
    '<span class="hn">FXループ</span>'+
    'アンプ側で歪ませる場合、空間系をギターとアンプの間に置くと、残響ごと歪んでしまいます。'+
    'これを避けるため、アンプの歪みの後ろへ台を差し込める口が付いている機種があります。'+
    'これがFXループ（センド／リターン）です。'+
    'センドから出た音が台を通り、リターンから戻ります。'+
    '音はアンプの中をいったん抜けて、また戻ってくることになります。'+
    '<span class="hn">板の上での見方</span>'+
    '列の中に、アンプの札が二枚あります。'+
    '<b>送り（SEND）</b>がループの入口、<b>戻り（RETURN）</b>が出口です。'+
    'この二枚に挟まれた台が、青い破線で囲まれたループの中を通ります。'+
    '始めの並びでは、ワウ・コンプ・歪みがアンプの前、残り十台がループの中です。<br>'+
    '送りの札は動かせます。左へ送るほどループに入る台が増え、'+
    '戻りの隣まで送れば、ループを使わない<b>一本道</b>になります。'+
    '戻りの札は動きません。アンプへ戻った先はスピーカーで、'+
    'そこに台を挟むことはないからです。'+
    '一本道にしてハイゲインの音色を選び、リバーブを掛けてみてください。'+
    '残響ごと歪んで濁ります。ループが要る理由が、そのまま耳で分かります。',

    /* 四枚目：入れ替え */
    '<div class="guide-h">入れ替えてみる</div>'+
    '<span class="lead">定石は出発点であって、正解ではありません。</span>'+
    '狙いがあれば、どこに置いても構いません。よく使われる入れ替えを挙げます。'+
    '<span class="hn">ワウを歪みの後ろへ</span>'+
    '歪んだ音の一部だけが持ち上がるので、掛かり方が派手になります。'+
    'ファンクやハードロックで聞かれる、動きのはっきりしたワウはこの繋ぎ方です。'+
    '<span class="hn">ボリュームを一番前へ</span>'+
    '絞ると歪みへ入る音が小さくなり、音量と一緒に歪みも減ります。'+
    '手元のボリュームつまみと同じ働きになるので、これを狙って前に置く人もいます。'+
    '<span class="hn">リバーブをディレイより前へ</span>'+
    'ひとまとまりになった残響が、そのまま返ってきます。'+
    '自然さは薄れますが、独特の空気感が出ます。'+
    '<span class="hn">歪みを空間系の後ろへ</span>'+
    '返り音ごと歪んで混ざり合い、濁ります。'+
    '普通は避けますが、これを効果として使う場面もあります。'+
    '<span class="hn">確かめ方</span>'+
    '板の絵を<b>横にドラッグ</b>して、実際に入れ替えてください。'+
    '台と台の隙間に寄せると、そこが開いて割り込みます。'+
    '台の真ん中に重ねると、その台と場所を交換します。'+
    '二台とも入れた状態で、順番だけを入れ替えて聞き比べるのが確実です。'+
    'キーボードなら、絵にフォーカスを当ててShiftを押しながら左右の矢印でも動きます。<br>'+
    '入れ替えた並びは次に開いた時も残ります。'+
    '始めの並びに戻したい時は、画面右上の「並びを戻す」を押してください。',

    /* 五枚目：載せなかった台 */
    '<div class="guide-h">この板に載せなかった台</div>'+
    '<span class="hn">ブースター</span>'+
    '音色を変えず、音量だけを持ち上げる台です。'+
    '歪みの前に置けば歪みが深くなり、後ろに置けば音量だけが上がります。'+
    'ソロで一段前に出る時に使います。'+
    '<span class="hn">オートワウ</span>'+
    '踏み板の代わりに、弾いた強さで山が動きます。'+
    '強く弾くと山が高いほうへ跳ね、弱く弾くと動きません。'+
    '足を使わずにワウの動きが得られます。'+
    '<span class="hn">オクターバー</span>'+
    '1オクターブ下の音を足して、太さを出します。'+
    'この板ではピッチシフターに1オクターブ下の設定がありますので、そちらで確かめられます。'+
    '<span class="hn">ロータリー</span>'+
    '回転するスピーカーの音を写した台です。'+
    'コーラスに似ていますが、回転の速さが切り替わる途中の変化に持ち味があります。'+
    '<span class="hn">ルーパー</span>'+
    '弾いた音を録って繰り返します。音そのものは変えません。'+
    '伴奏を重ねて一人で練習する道具として使います。板では一番最後に置きます。',

    /* 六枚目：チューナーと備品 */
    '<div class="guide-h">チューナーと、板の備品</div>'+
    '<span class="hn">チューナーの繋ぎ方</span>'+
    '二通りあります。'+
    '一つは音の道に割り込ませる繋ぎ方で、踏むと音が止まり、その間に合わせます。'+
    'もう一つは、ボリュームペダルなどに付いた出口から分けて送る繋ぎ方です。'+
    '後者なら音の道にチューナーが入りませんので、音そのものが変わりません。'+
    '<span class="hn">パワーサプライ</span>'+
    '台へ電気を配る箱です。'+
    '一つの口から分岐させると台どうしが干渉して雑音が出ることがあるため、'+
    '口が独立しているものが好まれます。'+
    '<span class="hn">スイッチャー</span>'+
    '複数の台をまとめて入切する箱です。'+
    '曲の切り替えで三台四台を同時に踏み替える場面で使います。'+
    '使わない台を音の道から完全に外せるので、通り道が短くなる利点もあります。'+
    '<span class="hn">パッチケーブル</span>'+
    '台と台を繋ぐ短いケーブルです。'+
    '長さと本数が増えるほど、高い成分から失われていきます。'+
    '板の上で台を詰めて並べるのは、見た目のためだけではありません。'
  ];
  var gPage=0;
  function paintGuide(){
    el('guideDoc').innerHTML=GUIDE[gPage]||'';
    el('gPos').textContent=(gPage+1)+' / '+GUIDE.length;
    el('gMid').textContent=(gPage+1)+' / '+GUIDE.length;
    el('gPrev').disabled=(gPage<=0);
    el('gNext').disabled=(gPage>=GUIDE.length-1);
    el('guide').scrollTop=0;
  }
  function openGuide(page){
    if(current) closePedal();
    gPage=(typeof page==='number'&&page>=0&&page<GUIDE.length)?page:0;
    paintGuide();
    el('guide').classList.add('on');
    el('map').classList.add('dim');
    document.body.style.overflow='hidden';
  }
  function closeGuide(){
    el('guide').classList.remove('on');
    el('map').classList.remove('dim');
    document.body.style.overflow='';
  }
  el('gClose').addEventListener('click',closeGuide);
  el('lineReset').addEventListener('click',function(){
    resetLine(); buildMap(); if(AC) rewire();
  });
  el('gPrev').addEventListener('click',function(){ if(gPage>0){ gPage--; paintGuide(); } });
  el('gNext').addEventListener('click',function(){ if(gPage<GUIDE.length-1){ gPage++; paintGuide(); } });
  document.addEventListener('keydown',function(e){
    if(!el('guide').classList.contains('on')) return;
    if(e.key==='Escape'){ closeGuide(); e.preventDefault(); }
    if(e.key==='ArrowLeft'&&gPage>0){ gPage--; paintGuide(); e.preventDefault(); }
    if(e.key==='ArrowRight'&&gPage<GUIDE.length-1){ gPage++; paintGuide(); e.preventDefault(); }
  });
  /* 板の左端、アンプの隣に置く札 */
  function guideSlot(){
    var d=document.createElement('div');
    d.className='guide-slot';
    var b=document.createElement('button');
    b.className='guide-btn'; b.type='button';
    b.setAttribute('aria-label','繋ぐ順の解説を読む');
    b.innerHTML='<svg viewBox="0 0 34 26" width="34" height="26">'+
        '<path d="M3 4h12v18H3z"/><path d="M19 4h12v18H19z"/><line x1="17" y1="3" x2="17" y2="23"/>'+
        '<line class="thin" x1="6" y1="9" x2="12" y2="9"/><line class="thin" x1="6" y1="13" x2="12" y2="13"/>'+
        '<line class="thin" x1="22" y1="9" x2="28" y2="9"/><line class="thin" x1="22" y1="13" x2="28" y2="13"/>'+
      '</svg><span>解説</span>';
    b.addEventListener('click',function(){ openGuide(0); });
    var c=document.createElement('div');
    c.className='cap'; c.textContent='繋ぐ順';
    d.appendChild(b); d.appendChild(c);
    return d;
  }

  /* ══════ 一台を開く ══════ */
  var docPage=0;                       /* 0=解説を出していない、1以上=解説の枚数 */
  function helpParts(p){
    if(!p) return [''];
    return (Object.prototype.toString.call(p.help)==='[object Array]')?p.help:[p.help];
  }
  function openPedal(id){
    var p=pedalOf(id);
    if(!p) return;
    if(current&&current!==p){
      stopPhrase();
      if(current.detach) current.detach();
    }
    var fresh=(current!==p);
    current=p; st.pedal=id; save();
    document.documentElement.style.setProperty('--case-top',p.theme.top);
    document.documentElement.style.setProperty('--case-mid',p.theme.mid);
    document.documentElement.style.setProperty('--case-bot',p.theme.bot);
    document.documentElement.style.setProperty('--led',p.theme.led);
    var order=chainOrder(), i=order.indexOf(id), z=zoneOf(id);
    el('pNo').textContent=(i+1<10?'0':'')+(i+1);
    el('pName').textContent=p.name;
    el('pWhere').textContent=z?z.name:'';
    el('panel').classList.add('on');
    el('map').classList.add('dim');
    document.body.style.overflow='hidden';
    if(fresh||!el('stage').firstChild){
      el('stage').innerHTML='';
      p.render(el('stage'));
    }
    /* 開いている間は、その一台だけを通して確かめる */
    soloId=id;
    if(AC) rewire();
    updateOnCount();
    docPage=0; showDoc();
    el('prevBtn').disabled=(i<=0);
    el('nextBtn').disabled=(i>=order.length-1);
    el('footMid').textContent=(i+1)+' / '+order.length;
    /* 板の上でも、開いている一台に印を付ける */
    var slots=document.querySelectorAll('.slot');
    for(var s=0;s<slots.length;s++)
      slots[s].classList.toggle('lit',slots[s].getAttribute('data-pedal')===id);
    el('panel').scrollTop=0;
  }
  function closePedal(){
    stopPhrase();
    current=null; st.pedal=null; save();
    soloId=null;                       /* 板の状態（踏んだ台）に戻す */
    if(AC) rewire();
    updateOnCount();
    el('panel').classList.remove('on');
    el('map').classList.remove('dim');
    document.body.style.overflow='';
    el('stage').innerHTML='';
    var slots=document.querySelectorAll('.slot');
    for(var s=0;s<slots.length;s++) slots[s].classList.remove('lit');
    paintTreadles();                    /* 面で動かした踏み板を板にも映す */
  }
  function step(dir){
    var order=chainOrder(), i=order.indexOf(st.pedal), j=i+dir;
    if(i<0||j<0||j>=order.length) return;
    openPedal(order[j]);
  }
  /* 解説は別の面。読む時だけ開き、筐体と入れ替える */
  function showDoc(){
    var parts=helpParts(current);
    var on=(docPage>0);
    el('doc').classList.toggle('on',on);
    el('doc').innerHTML=on?(parts[docPage-1]||''):'';
    el('stage').parentNode.style.display=on?'none':'';
    el('docPos').textContent=on?(docPage+' / '+parts.length):'';
    el('docBtn').textContent=on?
      ((docPage<parts.length)?'続きを読む':'ペダルへもどる'):'解説を読む';
  }
  el('docBtn').addEventListener('click',function(){
    var parts=helpParts(current);
    if(docPage===0) docPage=1;
    else if(docPage<parts.length) docPage++;
    else docPage=0;
    showDoc();
    el('panel').scrollTop=0;
  });
  el('closeBtn').addEventListener('click',closePedal);
  el('prevBtn').addEventListener('click',function(){ step(-1); });
  el('nextBtn').addEventListener('click',function(){ step(1); });
  document.addEventListener('keydown',function(e){
    if(!st.pedal) return;
    var t=e.target;
    if(t&&t.closest&&t.closest('.knob,.eq-slot,.wah-pedal,input,button,[role="slider"]')) return;
    if(e.key==='Escape'){ closePedal(); e.preventDefault(); }
    if(e.key==='ArrowLeft'){ step(-1); e.preventDefault(); }
    if(e.key==='ArrowRight'){ step(1); e.preventDefault(); }
  });

  buildMap();
  paintSwitches(); updateOnCount();
  drawTone(); drawArt(); drawPh();
  window.addEventListener('resize',function(){ drawWire(); });
  if(window.requestAnimationFrame) window.requestAnimationFrame(drawWire);

  window.__map={st:st,PEDALS:PEDALS,LINE:function(){ return LINE.slice(); },TONES:TONES,ARTS:ARTS,PHRASES:PHRASES,
                chainOrder:chainOrder,zoneOf:zoneOf,paintTreadles:paintTreadles,moveInLine:function(a,b){ return moveInLine(a,b); },moveToGap:function(a,k){ return moveToGap(a,k); },swapInLine:function(a,b){ return swapInLine(a,b); },resetLine:resetLine,sendIndex:sendIndex,loopIds:loopIds,layout:layout,drawWire:function(){ drawWire(); },
                openPedal:openPedal,closePedal:closePedal,
                activeIds:function(){ return activeIds(); },rewire:function(){ rewire(); },
                soloId:function(){ return soloId; },
                step:step,phraseOf:phraseOf,helpParts:helpParts,
                docPage:function(){ return docPage; },
                showDocPage:function(n){ docPage=n; showDoc(); }};
})();
</script>
<script>
/* 見た目の層「本物の機材」：つまみ・踏みスイッチ・LED・表示窓の質感（色の定義だけを足す） */
(function(){
  var d=document.createElement('div'); d.setAttribute('aria-hidden','true');
  d.style.cssText='position:absolute;width:0;height:0;overflow:hidden';
  d.innerHTML='<svg width="0" height="0"><defs>'
   +'<radialGradient id="rgKnob" cx="50%" cy="34%" r="70%"><stop offset="0" stop-color="#6b757b"/><stop offset=".28" stop-color="#2c3236"/><stop offset=".7" stop-color="#121517"/><stop offset="1" stop-color="#050607"/></radialGradient>'
   +'<radialGradient id="rgKnobDark" cx="50%" cy="34%" r="70%"><stop offset="0" stop-color="#f4f6f7"/><stop offset=".35" stop-color="#b9c1c5"/><stop offset=".8" stop-color="#6b7479"/><stop offset="1" stop-color="#3a4145"/></radialGradient>'
   +'<radialGradient id="rgChrome" cx="44%" cy="32%" r="72%"><stop offset="0" stop-color="#ffffff"/><stop offset=".18" stop-color="#dfe5e8"/><stop offset=".45" stop-color="#8a949a"/><stop offset=".62" stop-color="#cfd6da"/><stop offset=".85" stop-color="#4c555a"/><stop offset="1" stop-color="#2a3034"/></radialGradient>'
   +'<radialGradient id="rgLedOff" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#6a2a26"/><stop offset=".6" stop-color="#2a0f0d"/><stop offset="1" stop-color="#120605"/></radialGradient>'
   +'<linearGradient id="rgGlass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2328"/><stop offset=".45" stop-color="#05080a"/><stop offset="1" stop-color="#0b1013"/></linearGradient>'
   +'<filter id="rgDrop" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="1.2" stdDeviation=".9" flood-color="#000" flood-opacity=".75"/></filter>'
   +'<filter id="rgGlow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>'
   +'<filter id="rgGlowSoft" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation=".7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>'
   +'<pattern id="rgTread" width="6" height="4" patternUnits="userSpaceOnUse"><rect width="6" height="4" fill="#141618"/><rect y="0" width="6" height="1.6" fill="#2b2f32"/><rect y="1.6" width="6" height=".5" fill="#050606"/></pattern>'
   +'<linearGradient id="rgCap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f5f6"/><stop offset=".5" stop-color="#9aa3a8"/><stop offset="1" stop-color="#5a6368"/></linearGradient>'
   +'</defs></svg>';
  document.body.insertBefore(d,document.body.firstChild);
})();
</script>
